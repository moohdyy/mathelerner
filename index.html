<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einmaleins</title>
<!-- Tab-Symbol direkt eingebettet: ein Malzeichen auf grüner Kachel in den
     Farben aus :root (--ok und --bg). Als Data-URI bleibt es bei genau zwei
     ausgelieferten Dateien, und der Browser fragt nicht mehr nach
     /favicon.ico. Das „#“ der Farbwerte muss als %23 kodiert sein. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232e7d32'/%3E%3Cpath d='M10 10L22 22M22 10L10 22' stroke='%23fbfbfa' stroke-width='5.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fbfbfa; --fg: #1a1a1a; --muted: #8a8a85;
    --ok: #2e7d32; --bad: #c62828; --line: #e3e3df;
    /* Nur für die Kulanzphase des Timers. Grün und Rot sind der Bewertung
       einer Antwort vorbehalten — ein Timer in denselben Farben hieße an
       derselben Stelle zweierlei. */
    --warn: #a35a00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --fg: #f0f0ee; --muted: #85858c;
            --ok: #6dd47e; --bad: #ff6b6b; --line: #2c2d31;
            --warn: #e0a24a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 400 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3vh; padding: 4vh 5vw;
    -webkit-text-size-adjust: 100%;
  }
  /* Rückmeldung auf die Antwort.
     Vorher färbte sich 260 ms lang nur die Schrift der Aufgabe um — an genau
     der Stelle, von der der Blick beim Antworten längst weg ist. Jetzt färbt
     sich die ganze Fläche und läuft weich zum Hintergrund zurück.
     Zwei Signale, nicht eines: Farbe UND Zeichen. Wer Grün und Rot schlecht
     unterscheidet, liest trotzdem ✓ oder ✗ mitten auf dem Bild.
     Gedämpft, nicht grell: die Spitze liegt bei knapp einem Viertel Deckung,
     der Rücklauf dauert viermal so lang wie der Anstieg. Ein vollflächig
     blinkender Hintergrund wäre bei Kindern unangebracht. */
  #blitz {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  #blitz .flaeche {
    position: absolute; inset: 0; opacity: 0; background: var(--ok);
  }
  #blitz .zeichen {
    position: relative; opacity: 0; line-height: 1; font-weight: 300;
    font-size: clamp(6rem, 30vw, 15rem); color: var(--ok);
  }
  #blitz.bad .flaeche { background: var(--bad); }
  #blitz.bad .zeichen { color: var(--bad); }
  @keyframes blitz-flaeche {
    0% { opacity: 0 } 14% { opacity: .22 } 100% { opacity: 0 }
  }
  @keyframes blitz-zeichen {
    0%   { opacity: 0; transform: scale(.86) }
    16%  { opacity: 1; transform: scale(1) }
    55%  { opacity: .9; transform: scale(1) }
    100% { opacity: 0; transform: scale(1.05) }
  }
  #blitz.ok .flaeche, #blitz.bad .flaeche { animation: blitz-flaeche .72s ease-out both; }
  #blitz.ok .zeichen, #blitz.bad .zeichen { animation: blitz-zeichen .72s ease-out both; }

  /* Ohne Bewegung: dieselbe Aussage, nur ohne Größenwechsel und mit flacherer
     Spitze — das Aufleuchten soll auch dann nicht als Zucken ankommen. */
  @keyframes blitz-flaeche-ruhig {
    0% { opacity: 0 } 30% { opacity: .16 } 100% { opacity: 0 }
  }
  @keyframes blitz-zeichen-ruhig {
    0% { opacity: 0 } 30% { opacity: .95 } 70% { opacity: .95 } 100% { opacity: 0 }
  }
  @media (prefers-reduced-motion: reduce) {
    #blitz.ok .flaeche, #blitz.bad .flaeche { animation-name: blitz-flaeche-ruhig; }
    #blitz.ok .zeichen, #blitz.bad .zeichen { animation-name: blitz-zeichen-ruhig; }
  }

  /* Der ablaufende Timer. Ein flacher Balken direkt unter der Aufgabe, der von
     rechts nach links leerläuft. Die Marke sitzt dort, wo die schnelle Zeit
     endet und die Kulanz beginnt — erreicht der Balken sie, ist die Aufgabe
     noch zu retten, sie steigt nur keine Box mehr.
     Auch hier zwei Signale: die Farbe wechselt von grau nach bernstein UND der
     Balken wird dicker. Ruhig genug, dass er nicht hetzt, und ohne Zahl —
     ablesbar, ohne zu lesen. */
  #zeitbalken { position: relative; width: min(22rem, 80vw); height: 1rem; flex: none; }
  #zeitbahn, #zeitfuellung {
    position: absolute; top: 50%; left: 0;
    border-radius: 999px; transform: translateY(-50%);
  }
  #zeitbahn { right: 0; height: .3rem; background: var(--line); }
  #zeitfuellung {
    width: 100%; height: .3rem; background: var(--muted);
    transition: height .25s ease, background-color .25s ease;
  }
  #zeitbalken.kulanz #zeitfuellung { height: .62rem; background: var(--warn); }
  /* Steht die Uhr — die Aufgabe wird gerade vorgelesen, das Menü ist offen,
     die Auflösung wartet auf Bestätigung —, verschwindet die Füllung in der
     Bahn. Der Balken bleibt stehen, damit nichts springt, sagt aber nichts. */
  #zeitbalken.ruht #zeitfuellung { background: var(--line); height: .3rem; }
  #zeitmarke {
    position: absolute; top: 50%; left: 66.667%; width: 2px; height: .78rem;
    transform: translate(-50%, -50%); border-radius: 1px; background: var(--bg);
  }
  @media (prefers-reduced-motion: reduce) {
    #zeitfuellung { transition: none; }
  }

  #question {
    font-size: clamp(3rem, 18vw, 9rem); font-weight: 300;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    transition: color .12s ease; text-align: center;
  }
  #answer {
    font-family: inherit;
    font-size: clamp(2rem, 10vw, 4.5rem);
    font-weight: 300;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    width: 4.5ch; text-align: center; padding: .1em .1em .15em;
    background: transparent; color: inherit;
    border: none; border-bottom: 3px solid var(--line); border-radius: 0;
  }
  #answer:focus { outline: none; border-bottom-color: var(--fg); }
  #confirm {
    font: inherit; font-size: 1.1rem;
    width: min(22rem, 80vw); padding: .8rem 1rem; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: .6rem;
  }
  #confirm:active { color: var(--fg); border-color: var(--fg); }
  #feedback { min-height: 1.6em; font-size: 1.1rem; color: var(--muted); text-align: center; }

  /* Mikrofon-Statusanzeige. Ein einziges Objekt — ein fünfteiliger Pegel —
     trägt alle Zustände über Form, Bewegung und Farbe; die Wörter stützen ihn
     nur. Ein Kind muss aus zwei Metern erkennen, ob es sprechen darf, ohne zu
     lesen. Kein Rahmen, kein Schatten: die Seite hat sonst auch keine.
     Die Höhe ist fest, damit kein Zustandswechsel die Aufgabe verschiebt. */
  #mikrofonstatus {
    display: flex; align-items: center; gap: .85rem;
    height: 3.4rem; color: var(--muted);
  }
  #mikrofonpegel { display: flex; align-items: center; gap: .3rem; flex: none; }
  #mikrofonpegel i {
    display: block; width: .34rem; height: 2.1rem; border-radius: .17rem;
    background: currentColor; opacity: .5;
    transform: scaleY(.28); transform-origin: center;
  }
  #mikrofontexte { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
  #mikrofonzustand { font-size: 1.25rem; line-height: 1.25; }
  #mikrofongehoert {
    font-size: .95rem; line-height: 1.25; min-height: 1.25em; color: var(--muted);
    /* So breit, dass ein ausgesprochenes „siebenundzwanzig“ ganz dasteht, und
       schmal genug, dass die Zeile auf einem Handy nicht aus dem Rand läuft. */
    max-width: min(30ch, 68vw);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Grün heißt sprechen, Rot heißt danebengegangen, Grau heißt warten. */
  #mikrofonstatus.bereit, #mikrofonstatus.hoert { color: var(--ok); }
  #mikrofonstatus.verstanden { color: var(--fg); }
  #mikrofonstatus.fehler { color: var(--bad); }

  @keyframes mik-atem  { 0%, 100% { transform: scaleY(.28); opacity: .4 }
                         50%      { transform: scaleY(.55); opacity: 1 } }
  @keyframes mik-pegel { 0%, 100% { transform: scaleY(.24); opacity: .55 }
                         50%      { transform: scaleY(1);   opacity: 1 } }
  @keyframes mik-welle { 0%, 55%, 100% { transform: scaleY(.24); opacity: .35 }
                         25%           { transform: scaleY(.78); opacity: 1 } }

  /* Bereit: ein ruhiger, gleichmäßiger Atem — angeschaltet, aber still. */
  #mikrofonstatus.bereit i { animation: mik-atem 2.2s ease-in-out infinite; }
  /* Hört: die Balken tanzen. Unterschiedliche Dauern statt Verzögerungen,
     damit sie nie wieder gleichlaufen und es lebendig statt getaktet wirkt. */
  #mikrofonstatus.hoert i { animation: mik-pegel .6s ease-in-out infinite; }
  #mikrofonstatus.hoert i:nth-child(1) { animation-duration: .52s; }
  #mikrofonstatus.hoert i:nth-child(2) { animation-duration: .79s; }
  #mikrofonstatus.hoert i:nth-child(3) { animation-duration: .43s; }
  #mikrofonstatus.hoert i:nth-child(4) { animation-duration: .67s; }
  #mikrofonstatus.hoert i:nth-child(5) { animation-duration: .57s; }
  /* Verarbeitet: eine Welle läuft durch — Arbeit, kein Zuhören mehr. */
  #mikrofonstatus.verarbeitet i { animation: mik-welle 1.15s ease-in-out infinite; }
  #mikrofonstatus.verarbeitet i:nth-child(2) { animation-delay: .12s; }
  #mikrofonstatus.verarbeitet i:nth-child(3) { animation-delay: .24s; }
  #mikrofonstatus.verarbeitet i:nth-child(4) { animation-delay: .36s; }
  #mikrofonstatus.verarbeitet i:nth-child(5) { animation-delay: .48s; }
  /* Angekommen: alle Balken stehen voll. Fehler: alle liegen flach. */
  #mikrofonstatus.verstanden i { transform: scaleY(1); opacity: 1; }
  #mikrofonstatus.fehler i { transform: scaleY(.28); opacity: .9; }

  @media (prefers-reduced-motion: reduce) {
    /* Ohne Bewegung müssen die Formen die Zustände tragen. */
    #mikrofonpegel i { animation: none !important; }
    #mikrofonstatus.bereit i { transform: scaleY(.55); opacity: 1; }
    #mikrofonstatus.hoert i { opacity: 1; }
    #mikrofonstatus.hoert i:nth-child(1) { transform: scaleY(.42); }
    #mikrofonstatus.hoert i:nth-child(2) { transform: scaleY(.86); }
    #mikrofonstatus.hoert i:nth-child(3) { transform: scaleY(.55); }
    #mikrofonstatus.hoert i:nth-child(4) { transform: scaleY(1); }
    #mikrofonstatus.hoert i:nth-child(5) { transform: scaleY(.6); }
    #mikrofonstatus.verarbeitet i { opacity: .9; }
    #mikrofonstatus.verarbeitet i:nth-child(odd) { transform: scaleY(.62); }
  }
  #progress { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  #speicherwarnung {
    font-size: .9rem; color: var(--bad); text-align: center; max-width: 32ch;
  }
  #toolbar { position: fixed; top: 1rem; right: 1rem; display: flex; gap: .4rem; }
  #toolbar button {
    font-size: 1.1rem; line-height: 1; padding: .45rem .55rem; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: .5rem;
  }
  #toolbar button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
  #toolbar button[disabled] { opacity: .35; cursor: not-allowed; }
  #trainer {
    display: flex; flex-direction: column; align-items: center; gap: 3vh;
  }
  #done { text-align: center; max-width: 32ch; }
  #menu {
    position: fixed; inset: 0; background: var(--bg);
    padding: 6vh 5vw; overflow: auto;
    display: flex; flex-direction: column; gap: 1.4rem; align-items: flex-start;
  }
  /* Das Menü ist eine scrollende Spalte. Ohne dieses `flex: none` staucht
     Flexbox hohe Kinder zusammen, sobald der Inhalt länger wird als der
     Bildschirm — das Aufgabenraster war so auf ein Drittel seiner Höhe
     gequetscht und abgeschnitten. */
  #menu > * { flex: none; }
  #menu h2 { font-size: 1rem; font-weight: 600; margin: 0; }
  #menu label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: .3rem; }
  #menu select, #menu input[type="number"], #menu input[type="text"] {
    font: inherit; padding: .45rem .6rem; background: transparent; color: inherit;
    border: 1px solid var(--line); border-radius: .5rem;
  }
  #menu button {
    font: inherit; padding: .45rem .8rem; cursor: pointer;
    background: transparent; color: inherit;
    border: 1px solid var(--line); border-radius: .5rem;
  }
  .row { display: flex; gap: .5rem; align-items: flex-end; flex-wrap: wrap; }
  #menu p { margin: 0; }
  #stats { font-size: .9rem; color: var(--muted); line-height: 1.7; }
  #stats table { border-collapse: collapse; margin-top: .5rem; }
  #stats td { padding: .1rem .8rem .1rem 0; font-variant-numeric: tabular-nums; }

  /* Boxstufen. Eine Karte ist ein graues Gefäß, das sich mit jedem Treffer
     weiter füllt — den Unterschied trägt der Füllstand, nicht die Farbe.
     Wer Grün nicht von Grau unterscheiden kann, sieht ihn trotzdem: 0, 38,
     70, 100 Prozent sind vier verschiedene Formen, und die gemeisterte Karte
     trägt zusätzlich ein Zeichen.
     Die Regeln hängen an #menu, sonst gewinnt `#menu button` mit seiner
     `background`- und `border`-Kurzform gegen sie. */
  #menu .stufe {
    position: relative; flex: none; overflow: hidden;
    width: 1.5rem; height: 1.5rem;
    border: 1px solid var(--line); border-radius: .28rem;
    background: var(--line);
  }
  #menu .stufe .fuellung {
    position: absolute; left: 0; right: 0; bottom: 0; background: var(--ok);
  }
  #menu .stufe-0 .fuellung { height: 0; }
  #menu .stufe-1 .fuellung { height: 38%; opacity: .45; }
  #menu .stufe-2 .fuellung { height: 70%; opacity: .72; }
  #menu .stufe-3 .fuellung { height: 100%; opacity: 1; }
  #menu .stufe .zeichen {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    color: var(--bg); font-size: .8em; line-height: 1;
  }

  #boxlegende {
    list-style: none; margin: 0; padding: 0; width: 100%; max-width: 34rem;
    display: flex; flex-direction: column; gap: .95rem; font-size: .9rem;
  }
  #boxlegende li { display: flex; gap: .65rem; align-items: flex-start; }
  #boxlegende .stufe { margin-top: .15rem; }
  #boxlegende .text { flex: 1; min-width: 0; }
  #boxlegende .kopf { display: flex; gap: .6rem; justify-content: space-between; }
  #boxlegende .name { color: var(--fg); font-weight: 600; }
  #boxlegende .anzahl {
    color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  #boxlegende .erklaerung { color: var(--muted); line-height: 1.45; }
  #boxregeln { font-size: .9rem; color: var(--muted); line-height: 1.6; max-width: 46ch; }

  /* Das Raster: Zeile = erster Faktor, Spalte = zweiter Faktor. Feste
     Tabellenbreite, damit auch auf 360 px alle elf Spalten hineinpassen. */
  #kartenraster { width: 100%; max-width: 24rem; overflow-x: auto; }
  #kartenraster table {
    width: 100%; table-layout: fixed;
    border-collapse: separate; border-spacing: 2px;
  }
  #kartenraster th {
    padding: 0; text-align: center; font-weight: 400; font-size: .72rem;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  #kartenraster thead th:first-child { width: 1.4rem; }
  #kartenraster td { padding: 0; }
  /* Quadratisch über den Polster-Trick, nicht über `aspect-ratio`: in einer
     Tabellenzelle mit `table-layout: fixed` ist die Breite beim Berechnen der
     Höhe noch unbestimmt, und Chrome fällt dann auf die Inhaltshöhe zurück
     (gemessen: 27,8 × 24 px statt quadratisch). Das prozentuale Polster
     bezieht sich dagegen auf die Breite der Zelle. Die 2 px sind der Rahmen —
     bei `box-sizing: border-box` zählt er zur Höhe. */
  #menu #kartenraster .karte {
    display: block; width: 100%; height: 0; padding: 0 0 calc(100% - 2px);
    font-size: .78rem; cursor: pointer;
  }
  #menu #kartenraster .karte.gewaehlt { outline: 2px solid var(--fg); outline-offset: 1px; }
  #kartendetail {
    font-size: .9rem; color: var(--muted); line-height: 1.5;
    min-height: 3em; max-width: 46ch;
  }
  #kartendetail.aktiv { color: var(--fg); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="toolbar"></div>

<section id="menu" hidden>
  <h2>Profil</h2>
  <div class="row">
    <div>
      <label for="profile-select">Aktives Profil</label>
      <select id="profile-select"></select>
    </div>
    <button id="profile-delete">Löschen</button>
  </div>
  <div class="row">
    <div>
      <label for="profile-name">Neues Profil</label>
      <input id="profile-name" type="text" autocomplete="off" placeholder="Name">
    </div>
    <button id="profile-add">Anlegen</button>
  </div>

  <h2>Einstellungen</h2>
  <div>
    <label for="threshold">Zeitschwelle in Sekunden</label>
    <input id="threshold" type="number" min="1" max="30" step="0.5">
  </div>

  <h2>Fortschritt</h2>
  <div id="stats"></div>

  <h2>Alle 100 Aufgaben</h2>
  <ul id="boxlegende"></ul>
  <p id="boxregeln"></p>
  <div id="kartenraster"></div>
  <p id="kartendetail" aria-live="polite"></p>

  <button id="menu-close">Zurück zum Üben</button>
</section>

<main id="trainer">
  <div id="question" aria-live="polite">&nbsp;</div>
  <!-- Der Timer ist reine Anzeige: aria-hidden, damit die Vorlesehilfe nicht
       bei jeder Bildwiederholung dazwischenredet. Was zählt, sagt der Text in
       #feedback. -->
  <div id="zeitbalken" class="ruht" aria-hidden="true">
    <span id="zeitbahn"></span>
    <span id="zeitfuellung"></span>
    <span id="zeitmarke"></span>
  </div>
  <div id="mikrofonstatus" hidden>
    <span id="mikrofonpegel" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    <span id="mikrofontexte">
      <span id="mikrofonzustand" aria-live="polite"></span>
      <span id="mikrofongehoert" aria-live="polite"></span>
    </span>
  </div>
  <input id="answer" type="text" inputmode="numeric" autocomplete="off"
         autocorrect="off" spellcheck="false" aria-label="Antwort">
  <button id="confirm" type="button">OK</button>
  <div id="feedback" aria-live="polite"></div>
</main>

<div id="done" hidden>
  <p>Alles gemeistert. Nichts steht zur Auffrischung an.</p>
  <button id="freeplay">Trotzdem weiterüben</button>
</div>

<div id="progress"></div>
<div id="speicherwarnung" hidden></div>

<!-- Das Aufleuchten liegt über allem und fängt nichts ab (pointer-events:
     none). aria-hidden, weil das Zeichen dasselbe sagt wie #feedback. -->
<div id="blitz" aria-hidden="true">
  <span class="flaeche"></span>
  <span class="zeichen"></span>
</div>

<script src="logic.js"></script>
<script>
(function () {
  'use strict';

  var el = {
    question: document.getElementById('question'),
    answer: document.getElementById('answer'),
    confirm: document.getElementById('confirm'),
    feedback: document.getElementById('feedback'),
    zeitbalken: document.getElementById('zeitbalken'),
    zeitfuellung: document.getElementById('zeitfuellung'),
    zeitmarke: document.getElementById('zeitmarke'),
    blitz: document.getElementById('blitz'),
    blitzzeichen: document.querySelector('#blitz .zeichen'),
    mikrofonstatus: document.getElementById('mikrofonstatus'),
    mikrofonzustand: document.getElementById('mikrofonzustand'),
    mikrofongehoert: document.getElementById('mikrofongehoert'),
    progress: document.getElementById('progress'),
    speicherwarnung: document.getElementById('speicherwarnung'),
    trainer: document.getElementById('trainer'),
    done: document.getElementById('done'),
    freeplay: document.getElementById('freeplay'),
    menu: document.getElementById('menu'),
    toolbar: document.getElementById('toolbar'),
    profileSelect: document.getElementById('profile-select'),
    profileName: document.getElementById('profile-name'),
    profileAdd: document.getElementById('profile-add'),
    profileDelete: document.getElementById('profile-delete'),
    threshold: document.getElementById('threshold'),
    menuClose: document.getElementById('menu-close'),
    stats: document.getElementById('stats'),
    boxlegende: document.getElementById('boxlegende'),
    boxregeln: document.getElementById('boxregeln'),
    kartenraster: document.getElementById('kartenraster'),
    kartendetail: document.getElementById('kartendetail')
  };

  var state = ML.loadState(window.localStorage);
  if (!state.activeProfile) {
    var created = ML.createProfile(state, 'Ich', Date.now());
    state = created.state;
    ML.saveState(window.localStorage, state);
  }

  var session = {
    currentKey: null,
    expected: 0,
    startedAt: 0,
    recent: [],
    answered: 0,
    refreshesShown: 0,
    awaitingAck: false,   // wartet nach einem Fehler auf die Bestätigung
    freeplay: false,
    ausFreiemUeben: false,   // aktuelle Karte stammt aus dem freien Weiterüben
    sitzungGezaehlt: false   // erst die erste Antwort macht daraus eine Sitzung
  };

  // Zwei-Schritt-Bestätigung für das Löschen eines Profils.
  var loeschBestaetigung = false;

  function profile() { return state.profiles[state.activeProfile]; }

  var speicherWarnungGezeigt = false;
  function persist() {
    var ok = ML.saveState(window.localStorage, state);
    if (!ok && !speicherWarnungGezeigt) {
      speicherWarnungGezeigt = true;
      // Eigenes Element: #feedback wird bei jeder Antwort neu geschrieben und
      // hätte die Warnung noch im selben Tick überschrieben.
      el.speicherwarnung.textContent =
        'Achtung: Der Fortschritt kann in diesem Browser nicht gespeichert werden.';
      el.speicherwarnung.hidden = false;
    }
  }

  function thresholdMs() { return profile().settings.thresholdMs; }

  // Wie lange das Aufleuchten dauert. Muss mit den beiden CSS-Animationen
  // übereinstimmen — sie sind auf .72s gestellt.
  var BLITZ_DAUER_MS = 720;
  var blitzTimer = null;

  // Die ganze Fläche färbt sich kurz ein und läuft weich zum Hintergrund
  // zurück; das Zeichen in der Mitte sagt dasselbe noch einmal ohne Farbe.
  // `art` ist 'ok' oder 'bad'.
  function flash(art) {
    if (blitzTimer !== null) clearTimeout(blitzTimer);
    el.blitz.className = '';
    el.blitzzeichen.textContent = art === 'ok' ? '✓' : '✗';
    // Ohne diesen erzwungenen Umbruch startet die Animation bei zwei schnell
    // aufeinanderfolgenden Antworten nicht neu: die Klasse war im selben Tick
    // nie wirklich weg, und der Browser sieht keinen Wechsel.
    void el.blitz.offsetWidth;
    el.blitz.className = art;
    blitzTimer = setTimeout(function () {
      blitzTimer = null;
      el.blitz.className = '';
    }, BLITZ_DAUER_MS);
  }

  /* ---------- Sichtbarer Timer und Gesamtfrist ---------- */

  // Zwei Uhren, aber nur ein Maß: gezeichnet wird je Bildwiederholung, die
  // Frist hängt an einem eigenen setTimeout. Gerechnet wird an beiden Stellen
  // aus `Date.now() - session.startedAt` — nie aus der Zahl der Ticks. Im
  // Hintergrundtab läuft requestAnimationFrame gar nicht und setTimeout wird
  // gedrosselt; nur echte Zeitstempel überstehen das.
  //
  // Die Anzeige ersetzt die Zeitmessung nicht. Gewertet wird weiterhin allein
  // die gemessene Zeit über gradeAnswer.
  var zeit = {
    basis: 0,          // für welchen session.startedAt gerade gestellt ist
    frist: null,       // Handle des Fristablaufs
    bild: null,        // Handle der Zeichenschleife
    ausgeloest: false  // damit ein Fristablauf genau einmal wirkt
  };

  var ruhigeBewegung = typeof window.matchMedia === 'function'
    ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;

  // Welche Schwelle gerade gilt. Im Sprachmodus zählt der Bonus mit, sonst
  // liefe der Balken gegen eine andere Zeit, als am Ende gewertet wird.
  function zeitSchwelleMs() {
    return stt.active ? sttThresholdMs() : thresholdMs();
  }

  // Die eine Frage, ob die Uhr gerade überhaupt laufen darf.
  // `session.startedAt === 0` heißt „läuft noch nicht" — die Aufgabe wird
  // gerade vorgelesen. Hinter dem offenen Menü und während der Fehleranzeige
  // läuft ebenfalls nichts.
  function zeitLaeuft() {
    return session.currentKey !== null && !session.awaitingAck
        && el.menu.hidden && session.startedAt !== 0;
  }

  function zeitStopp() {
    if (zeit.frist !== null) { clearTimeout(zeit.frist); zeit.frist = null; }
    if (zeit.bild !== null) { window.cancelAnimationFrame(zeit.bild); zeit.bild = null; }
    zeit.basis = 0;
    el.zeitbalken.className = 'ruht';
    el.zeitfuellung.style.width = '100%';
  }

  function zeitZeichnen() {
    var a = ML.zeitAnzeige(Date.now() - session.startedAt, zeitSchwelleMs());
    // Ohne Bewegung springt der Balken in Zwanzigsteln, statt zu gleiten: er
    // bleibt ablesbar, ohne dauernd zu laufen.
    var anteil = ruhigeBewegung ? Math.ceil(a.anteil * 20) / 20 : a.anteil;
    el.zeitfuellung.style.width = (anteil * 100).toFixed(2) + '%';
    el.zeitbalken.className = a.phase === ML.ZEIT_SCHNELL ? 'schnell' : 'kulanz';
  }

  function zeitSchleife() {
    zeit.bild = null;
    if (!zeitLaeuft()) return;
    zeitZeichnen();
    zeit.bild = window.requestAnimationFrame(zeitSchleife);
  }

  // Der einzige Weg, den Timer zu stellen. Sie prüft selbst, ob gerade
  // gemessen wird, und darf deshalb aus jedem Zustandswechsel heraus gerufen
  // werden — genau dadurch können Anzeige und Wertung nicht auseinanderlaufen.
  function zeitAktualisieren() {
    if (!zeitLaeuft()) { zeitStopp(); return; }
    if (zeit.basis === session.startedAt && zeit.frist !== null) return;   // läuft schon
    if (zeit.frist !== null) { clearTimeout(zeit.frist); zeit.frist = null; }
    if (zeit.bild !== null) { window.cancelAnimationFrame(zeit.bild); zeit.bild = null; }

    var schwelle = zeitSchwelleMs();
    var gesamt = ML.gesamtfristMs(schwelle);
    el.zeitmarke.style.left = (ML.zeitAnzeige(0, schwelle).schwellenAnteil * 100) + '%';
    if (gesamt <= 0) { zeitStopp(); return; }   // unbrauchbare Schwelle: keine Frist

    zeit.basis = session.startedAt;
    zeit.ausgeloest = false;
    // Die Frist zählt ab startedAt, nicht ab jetzt: wird mitten in der Aufgabe
    // neu gestellt — das Mikrofon ändert die geltende Schwelle —, bleibt die
    // bereits verstrichene Zeit stehen.
    var rest = gesamt - (Date.now() - session.startedAt);
    zeit.frist = setTimeout(zeitFristAbgelaufen, Math.max(0, rest));
    zeitZeichnen();
    zeit.bild = window.requestAnimationFrame(zeitSchleife);
  }

  // Erzwingt ein Neustellen der Frist, ohne die Uhr selbst anzufassen. Nötig,
  // wenn sich die geltende Schwelle mitten in der Aufgabe ändert.
  function zeitNeuStellen() {
    zeit.basis = 0;
    zeitAktualisieren();
  }

  // Die Frist ist abgelaufen: die Aufgabe gilt als falsch. Gewertet wird
  // ausschließlich über submitAnswer — es darf keinen zweiten Weg in die
  // Speicherschicht geben, sonst gibt es zwei Stellen, die eine Karte
  // verändern, und eine davon wird irgendwann falsch.
  function zeitFristAbgelaufen() {
    zeit.frist = null;
    if (zeit.ausgeloest) return;          // genau einmal
    if (!zeitLaeuft()) return;            // Menü offen, Fehleranzeige, Vorlesen
    var schwelle = zeitSchwelleMs();
    var gesamt = ML.gesamtfristMs(schwelle);
    if (gesamt <= 0) return;
    var verstrichen = Date.now() - session.startedAt;
    if (verstrichen < gesamt) {
      // Der Timer kam zu früh — etwa weil die geltende Schwelle inzwischen
      // größer ist. Gewertet wird die echte Zeit, nie der Tick: neu stellen.
      zeit.frist = setTimeout(zeitFristAbgelaufen, gesamt - verstrichen);
      return;
    }
    zeit.ausgeloest = true;
    // Erst schweigen, dann werten: ein danach noch eintreffendes Erkennungs-
    // ergebnis darf die bereits gewertete Karte nicht ein zweites Mal anfassen.
    stopListening();
    submitAnswer(null, verstrichen, schwelle, true);
  }

  function render() {
    el.progress.textContent = 'noch ' + ML.openCount(profile()) + ' von 100 offen';
  }

  function nextQuestion() {
    var key = ML.pickNext(profile().cards, {
      now: Date.now(),
      recent: session.recent,
      answered: session.answered,
      refreshesShown: session.refreshesShown,
      rng: Math.random
    });

    if (key === null && !session.freeplay) {
      session.currentKey = null;
      el.trainer.hidden = true;
      el.done.hidden = false;
      render();
      mikAktualisieren();
      zeitAktualisieren();   // auf dem Abschlussbildschirm läuft keine Frist
      return;
    }
    var ausFreiemUeben = false;
    if (key === null) {
      // Freies Weiterüben: gleichgewichtet aus allen Karten ziehen.
      var all = Object.keys(profile().cards);
      key = all[Math.floor(Math.random() * all.length)];
      ausFreiemUeben = true;
    }

    // Nur echte, von pickNext eingeplante Auffrischungen zählen gegen die Quote.
    if (!ausFreiemUeben && profile().cards[key].box === ML.BOX_MASTERED) {
      session.refreshesShown++;
    }

    var ab = ML.parseCardKey(key);
    session.currentKey = key;
    session.expected = ab.a * ab.b;
    session.startedAt = Date.now();
    session.awaitingAck = false;
    session.ausFreiemUeben = ausFreiemUeben;

    el.question.textContent = ab.a + ' × ' + ab.b;
    el.answer.value = '';
    el.feedback.textContent = '';
    el.confirm.textContent = 'OK';
    // Nicht ins unsichtbare Feld hinter dem offenen Menü fokussieren —
    // das holte auf dem Handy die Zifferntastatur über das Menü.
    if (el.menu.hidden) el.answer.focus();
    render();

    if (profile().settings.tts && tts.unlocked) {
      // Uhr und Mikrofon starten erst, wenn die Aufgabe fertig vorgelesen ist.
      session.startedAt = 0;
      wirdVorgelesen = true;
      stopListening();
      speak(ML.spokenQuestion(ab.a, ab.b), function () {
        wirdVorgelesen = false;
        if (session.currentKey !== key) {
          // Die Aufgabe hat inzwischen gewechselt: die Uhr der neuen Aufgabe
          // darf dieser Rücklauf nicht anfassen. Das Zuhören muss er trotzdem
          // anwerfen — sonst bleibt das Mikrofon still, weil die Sperre
          // wirdVorgelesen jeden früheren startListening()-Aufruf abgewiesen hat.
          startListening();
          return;
        }
        session.startedAt = Date.now();
        zeitAktualisieren();   // erst jetzt läuft der sichtbare Timer los
        startListening();
      });
    } else {
      wirdVorgelesen = false;
      if (stt.active) startListening();
      else mikAktualisieren();
    }
    // Zuletzt, damit beide Zweige abgedeckt sind: im Vorlese-Zweig steht
    // startedAt auf 0 und der Balken ruht, sonst läuft er ab hier.
    zeitAktualisieren();
  }

  // elapsedMs kann übersteuert werden (Sprachmodus misst anders).
  // `zeitUm` kommt ausschließlich vom Fristablauf: dann gibt es keinen Wert,
  // und die Aufgabe ist ohne weitere Prüfung falsch. Der Fristablauf hat
  // bewusst keinen eigenen Weg in die Speicherschicht, sondern geht hier
  // durch — es darf nur eine Stelle geben, die eine Karte wertet.
  function submitAnswer(value, elapsedMs, overrideThresholdMs, zeitUm) {
    if (session.currentKey === null || session.awaitingAck) return;
    if (!zeitUm && (value === null || isNaN(value))) return;   // nicht verstanden: nicht werten

    // Ab hier wird gewertet: die Uhr darf nicht daneben weiterlaufen und
    // gleich noch ein zweites Mal zuschlagen.
    zeitStopp();

    var elapsed = typeof elapsedMs === 'number'
      ? elapsedMs
      : (session.startedAt === 0 ? 0 : Date.now() - session.startedAt);
    var correct = !zeitUm && value === session.expected;
    var p = profile();

    if (!session.sitzungGezaehlt) {
      // Eine Sitzung ist laut Spec ein Seitenaufruf MIT mindestens einer Antwort.
      p.stats.sessions++;
      session.sitzungGezaehlt = true;
    }

    if (session.ausFreiemUeben) {
      // Freies Weiterüben läuft laut Spec ohne Boxwirkung: die Karte wird
      // nicht bewertet, es gibt nur die Rückmeldung.
      p.stats.totalAnswers++;
    } else {
      p.cards[session.currentKey] = ML.gradeAnswer(p.cards[session.currentKey], {
        correct: correct, elapsedMs: elapsed,
        thresholdMs: typeof overrideThresholdMs === 'number' ? overrideThresholdMs : thresholdMs(),
        now: Date.now()
      });
      p.stats.totalAnswers++;
    }

    session.recent.push(session.currentKey);
    if (session.recent.length > ML.RECENT_MEMORY) session.recent.shift();
    session.answered++;
    persist();

    if (correct) {
      flash('ok');
      nextQuestion();
    } else {
      flash('bad');
      el.feedback.textContent = (zeitUm ? 'Zeit ist um. ' : '') +
        'Richtig wäre ' + session.expected + ' — mit Enter oder dem Knopf weiter';
      el.confirm.textContent = 'Weiter';
      session.awaitingAck = true;
      stopListening();   // während der Fehleranzeige nicht zuhören
      render();
    }
  }

  // Enter und die breite Touch-Fläche tun genau dasselbe — eine Funktion für
  // beide, damit sie nicht auseinanderlaufen können.
  function bestaetigen() {
    if (session.awaitingAck) { nextQuestion(); return; }
    var raw = el.answer.value.trim();
    if (!/^\d+$/.test(raw)) return;
    submitAnswer(parseInt(raw, 10));
  }

  el.answer.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    bestaetigen();
  });

  el.confirm.addEventListener('click', function () {
    bestaetigen();
    // Auf dem Tablet bleibt die Tastatur so am Feld statt am Knopf.
    if (el.menu.hidden) el.answer.focus();
  });

  el.freeplay.addEventListener('click', function () {
    session.freeplay = true;
    el.done.hidden = true;
    el.trainer.hidden = false;
    nextQuestion();
  });

  /* ---------- Sprachausgabe ---------- */

  var tts = {
    supported: typeof window.speechSynthesis !== 'undefined',
    voice: null,
    unlocked: false
  };

  // Solange die Aufgabe vorgelesen wird, darf das Mikrofon nicht zuhören —
  // sonst erkennt es die eigene Sprachausgabe als Antwort.
  var wirdVorgelesen = false;

  function pickGermanVoice() {
    if (!tts.supported) return;
    var voices = window.speechSynthesis.getVoices();
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang && voices[i].lang.toLowerCase().indexOf('de') === 0) {
        tts.voice = voices[i];
        return;
      }
    }
  }

  if (tts.supported) {
    pickGermanVoice();
    // Die Stimmenliste ist beim ersten Aufruf oft noch leer.
    window.speechSynthesis.addEventListener('voiceschanged', pickGermanVoice);
  }

  // Manche Engines halten die Sprachausgabe an, ohne je onend oder onerror zu
  // melden — etwa wenn der Tab in den Hintergrund gerät. Ohne diesen Wachhund
  // bliebe die Uhr dann auf 0 stehen und jede Antwort zählte als Treffer.
  var SPRECH_ZEITGRENZE_MS = 5000;

  function speak(text, onEnd) {
    if (!tts.supported) { if (onEnd) onEnd(); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    if (tts.voice) u.voice = tts.voice;
    u.rate = 0.95;
    var done = false;
    var wachhund = null;
    function finish() {
      if (done) return;
      done = true;
      if (wachhund !== null) clearTimeout(wachhund);
      if (onEnd) onEnd();
    }
    u.onend = finish;
    u.onerror = finish;   // sonst bliebe die Uhr bei einem Engine-Fehler stehen
    wachhund = setTimeout(finish, SPRECH_ZEITGRENZE_MS);
    try {
      window.speechSynthesis.speak(u);
    } catch (e) {
      // Manche Engines werfen synchron; die Uhr darf davon nicht stehenbleiben.
      finish();
    }
  }

  var ttsButton = document.createElement('button');
  ttsButton.id = 'tts-toggle';
  ttsButton.type = 'button';
  ttsButton.textContent = '🔊';
  ttsButton.title = 'Aufgabe vorlesen';
  if (!tts.supported) {
    ttsButton.disabled = true;
    ttsButton.title = 'Dieser Browser kann nicht vorlesen';
  }
  el.toolbar.appendChild(ttsButton);

  function renderTtsButton() {
    // Der Knopf zeigt nur "an", wenn auch wirklich gesprochen wird. Nach einem
    // Neuladen ist die Einstellung zwar noch gespeichert, der Browser verlangt
    // aber erst eine Nutzergeste — bis dahin steht der Knopf ehrlich auf "aus".
    var sprichtWirklich = profile().settings.tts && tts.unlocked;
    ttsButton.setAttribute('aria-pressed', sprichtWirklich ? 'true' : 'false');
  }

  ttsButton.addEventListener('click', function () {
    if (!tts.supported) return;
    var p = profile();
    if (p.settings.tts && !tts.unlocked) {
      // Die Einstellung war gespeichert, es fehlte nur die Geste, die der
      // Browser verlangt. Dieser Klick ist sie — also freischalten statt
      // ausschalten.
      tts.unlocked = true;
    } else {
      p.settings.tts = !p.settings.tts;
      if (p.settings.tts) tts.unlocked = true;
    }
    persist();
    renderTtsButton();
    if (session.currentKey === null) return;   // Abschlussbildschirm: nichts vorzulesen
    if (p.settings.tts) {
      // Dieser Klick ist die Nutzergeste, die iOS/Safari verlangt.
      var schluessel = session.currentKey;
      var ab = ML.parseCardKey(schluessel);
      session.startedAt = 0;
      zeitAktualisieren();   // Uhr angehalten: auch der Balken ruht
      wirdVorgelesen = true;
      stopListening();
      speak(ML.spokenQuestion(ab.a, ab.b), function () {
        wirdVorgelesen = false;
        if (session.currentKey !== schluessel) {
          // Aufgabe gewechselt: Uhr in Ruhe lassen, Zuhören aber wieder
          // anwerfen (siehe nextQuestion).
          startListening();
          return;
        }
        session.startedAt = Date.now();
        zeitAktualisieren();
        startListening();
      });
    } else {
      window.speechSynthesis.cancel();
      session.startedAt = Date.now();
      zeitAktualisieren();
    }
  });

  /* ---------- Spracheingabe ---------- */

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  var STT_MAX_FEHLER_IN_FOLGE = 5;

  // Wachhund der Spracheingabe — dasselbe Motiv wie SPRECH_ZEITGRENZE_MS bei
  // der Sprachausgabe: der Neustart des Zuhörens hing allein am 'end'-Ereignis
  // des Erkenners. Bleibt das ein einziges Mal aus — weil start() folgenlos
  // blieb, weil start() geworfen hat, weil die Engine hängt —, ist das
  // Mikrofon bis zur nächsten Bedienung endgültig still, obwohl der Knopf
  // weiter "an" zeigt.
  //
  // Bis zum 'start'-Ereignis: mit erteilter Erlaubnis meldet Chrome den Beginn
  // binnen weniger Millisekunden. 3 s lassen einem langsamen Geräte- oder
  // Netzstart Luft und sind kurz genug, dass ein Kind den Aussetzer kaum merkt.
  var STT_START_ZEITGRENZE_MS = 3000;
  // Beim allerersten Durchgang kann die Erlaubnisabfrage des Browsers offen
  // stehen. Solange darf der Wachhund nicht dazwischenfunken, sonst schaltet er
  // das Mikrofon ab, während der Erwachsene noch den Dialog liest.
  var STT_ERSTSTART_ZEITGRENZE_MS = 30000;
  // Nach bestätigtem Start bis zum nächsten Lebenszeichen. Chrome meldet von
  // sich aus nach einigen Sekunden Stille 'no-speech' und danach 'end'; die
  // Grenze muss deutlich darüber liegen, damit ruhiges Nachdenken nicht als
  // Aussetzer gilt. Sie ist die letzte Reißleine, nicht der Normalfall.
  var STT_LEBEN_ZEITGRENZE_MS = 20000;
  // Bremse gegen einen Neustart-Sturm, wenn start() sofort wirft.
  var STT_NEUSTART_VERZOEGERUNG_MS = 300;

  var stt = {
    supported: !!SR,
    secure: window.isSecureContext === true && window.location.protocol !== 'file:',
    active: false,
    recognizer: null,
    spokeEndAt: 0,
    permissionDenied: false,
    fehlerInFolge: 0,
    // Buchführung über den laufenden Zuhör-Durchgang.
    laufNr: 0,          // laufende Nummer, macht überlappende Durchgänge unterscheidbar
    gestartet: false,   // hat der aktuelle Durchgang nachweislich begonnen?
    jeGestartet: false, // hat je einer begonnen? Dann ist die Erlaubnis erteilt.
    wachhund: null      // Timer-Handle des Wachhunds
  };

  // Reine Diagnose: das Protokoll darf nichts an der Bedienung ändern, nichts
  // in der Oberfläche anzeigen und keine Zustandslogik beeinflussen. Festes
  // Präfix, damit sich die Konsole danach filtern lässt; Durchgangsnummer und
  // Kartenschlüssel, weil sich überlappende Durchgänge sonst nicht auseinander-
  // halten lassen — und genau die sind der interessante Fall.
  function sttProtokoll(nr, karte, text) {
    if (typeof console === 'undefined' || !console.log) return;
    console.log('[STT] #' + nr + ' ' + (karte === null ? '—' : karte) + ' ' + text);
  }

  /* ---------- Statusanzeige des Mikrofons ---------- */

  // Die Anzeige ist reine Rückmeldung: sie wertet keine Karte, reicht keine
  // Antwort ein und fasst die Zeitmessung nicht an. Zwei Bausteine:
  //
  //   1. Der laufende Zustand wird aus der Lage abgeleitet (ML.mikrofonZustand)
  //      und bei jedem Ereignis neu berechnet.
  //   2. Die kurzlebigen Meldungen — verstanden, nicht verstanden, nichts
  //      gehört — werden gesetzt und halten die Ableitung eine Weile fest.
  //      Ohne diese Sperre wären sie unsichtbar: die nächste Aufgabe folgt im
  //      selben Tick, genau wie bei #feedback.
  var MIK_HALTEDAUER_MS = 1800;
  // Der gehörte Text lebt länger als die Meldung: er soll noch dastehen,
  // während das Kind über die nächste Aufgabe nachdenkt.
  var MIK_ECHO_DAUER_MS = 7000;
  var MIK_ECHO_MAX_ZEICHEN = 32;

  var mik = {
    spricht: false,       // zwischen speechstart/soundstart und speechend
    verarbeitet: false,   // zwischen speechend und Ergebnis oder Fehler
    sperrTimer: null,     // hält eine kurzlebige Meldung fest
    echoTimer: null
  };

  var MIK_TEXTE = {};
  MIK_TEXTE[ML.MIK_PAUSIERT] = 'Mikrofon pausiert';
  MIK_TEXTE[ML.MIK_VORLESEN] = 'Noch nicht sprechen';
  MIK_TEXTE[ML.MIK_STARTET] = 'Mikrofon startet …';
  MIK_TEXTE[ML.MIK_BEREIT] = 'Jetzt sprechen';
  MIK_TEXTE[ML.MIK_HOERT] = 'Ich höre dich';
  MIK_TEXTE[ML.MIK_VERARBEITET] = 'Einen Moment …';

  // Welche Balkenform zu welchem Zustand gehört. „wartet“ ist die ruhige
  // Grundform für alles, was zum Warten auffordert.
  var MIK_FORMEN = {};
  MIK_FORMEN[ML.MIK_PAUSIERT] = 'wartet';
  MIK_FORMEN[ML.MIK_VORLESEN] = 'wartet';
  MIK_FORMEN[ML.MIK_STARTET] = 'wartet';
  MIK_FORMEN[ML.MIK_BEREIT] = 'bereit';
  MIK_FORMEN[ML.MIK_HOERT] = 'hoert';
  MIK_FORMEN[ML.MIK_VERARBEITET] = 'verarbeitet';

  function mikSchreiben(form, text) {
    el.mikrofonstatus.hidden = false;
    el.mikrofonstatus.className = form;
    el.mikrofonzustand.textContent = text;
  }

  function mikSperreLoeschen() {
    if (mik.sperrTimer === null) return;
    clearTimeout(mik.sperrTimer);
    mik.sperrTimer = null;
  }

  // Setzt eine kurzlebige Meldung und hält sie fest. Ein Aufruf mit erzwingen
  // im Rücken (mikAktualisieren(true)) räumt sie jederzeit wieder ab.
  function mikMelden(form, text) {
    mikSperreLoeschen();
    mikSchreiben(form, text);
    mik.sperrTimer = setTimeout(function () {
      mik.sperrTimer = null;
      mikAktualisieren();
    }, MIK_HALTEDAUER_MS);
  }

  function mikAktualisieren(erzwingen) {
    if (erzwingen) mikSperreLoeschen();
    else if (mik.sperrTimer !== null) return;   // kurzlebige Meldung steht noch
    var zustand = ML.mikrofonZustand({
      aktiv: stt.supported && stt.secure && stt.active,
      pausiert: !el.menu.hidden || session.awaitingAck || session.currentKey === null,
      wirdVorgelesen: wirdVorgelesen,
      verarbeitet: mik.verarbeitet,
      spricht: mik.spricht,
      gestartet: stt.gestartet
    });
    if (zustand === ML.MIK_AUS) {
      // Aus heißt weg: eine graue Zeile ohne Aussage lenkt beim Tippen nur ab.
      el.mikrofonstatus.hidden = true;
      el.mikrofonstatus.className = '';
      el.mikrofonzustand.textContent = '';
      mikEchoLoeschen();
      return;
    }
    mikSchreiben(MIK_FORMEN[zustand], MIK_TEXTE[zustand]);
  }

  function mikEchoLoeschen() {
    if (mik.echoTimer !== null) { clearTimeout(mik.echoTimer); mik.echoTimer = null; }
    el.mikrofongehoert.textContent = '';
  }

  // Zeigt, was der Erkenner verstanden hat — auch und gerade dann, wenn es
  // falsch war. textContent, nie innerHTML: der Text kommt von außen.
  function mikEchoSetzen(text) {
    mikEchoLoeschen();
    var sauber = String(text === null || text === undefined ? '' : text).trim();
    if (sauber === '') return;
    if (sauber.length > MIK_ECHO_MAX_ZEICHEN) {
      sauber = sauber.slice(0, MIK_ECHO_MAX_ZEICHEN) + '…';
    }
    el.mikrofongehoert.textContent = 'gehört: „' + sauber + '“';
    mik.echoTimer = setTimeout(function () {
      mik.echoTimer = null;
      el.mikrofongehoert.textContent = '';
    }, MIK_ECHO_DAUER_MS);
  }

  // Die eine Frage, ob gerade überhaupt zugehört werden soll. In allen anderen
  // Zuständen ist Stille richtig, und der Wachhund hat zu schweigen.
  function zuhoerenErwartet() {
    return stt.active && !wirdVorgelesen && el.menu.hidden
        && !session.awaitingAck && session.currentKey !== null;
  }

  function wachhundLoeschen() {
    if (stt.wachhund === null) return;
    clearTimeout(stt.wachhund);
    stt.wachhund = null;
  }

  // Stellt den Wachhund auf den aktuellen Durchgang. Ein abgelöster Durchgang
  // kann damit weder den Wachhund eines neuen abräumen noch ihn auslösen: die
  // Nummer wird beim Stellen festgehalten und beim Anschlagen geprüft.
  function wachhundStellen(frist, grund) {
    wachhundLoeschen();
    var nr = stt.laufNr;
    var karte = session.currentKey;
    stt.wachhund = setTimeout(function () {
      stt.wachhund = null;
      if (nr !== stt.laufNr) {
        sttProtokoll(nr, karte, 'Wachhund verworfen (abgelöst)');
        return;
      }
      if (!zuhoerenErwartet()) {
        sttProtokoll(nr, karte, 'Wachhund still (zu Recht kein Zuhören)');
        return;
      }
      // Der Wachhund wertet NIE eine Karte und reicht NIE eine Antwort ein —
      // er startet ausschließlich das Zuhören neu. Er zahlt dabei in dieselbe
      // Bremse ein wie die Erkennerfehler, sonst feuerte er offline oder mit
      // kaputtem Mikrofon endlos.
      stt.fehlerInFolge++;
      if (stt.fehlerInFolge >= STT_MAX_FEHLER_IN_FOLGE) {
        sttProtokoll(nr, karte, 'Wachhund gibt auf nach ' + stt.fehlerInFolge + ' Versuchen');
        setSttActive(false);
        el.feedback.textContent = 'Mikrofon funktioniert gerade nicht — bitte tippen';
        return;
      }
      sttProtokoll(nr, karte, 'Wachhund: ' + grund + ' — Neustart (' + stt.fehlerInFolge + ')');
      startListening();
    }, frist);
  }

  // Jedes Ereignis des aktuellen Durchgangs ist ein Lebenszeichen und setzt die
  // Frist zurück. Ereignisse eines abgelösten Erkenners bleiben folgenlos.
  function sttLebenszeichen(rec, frist, grund) {
    if (rec !== stt.recognizer) return;
    wachhundStellen(frist, grund);
  }

  function sttStartFrist() {
    return stt.jeGestartet ? STT_START_ZEITGRENZE_MS : STT_ERSTSTART_ZEITGRENZE_MS;
  }

  function sttThresholdMs() { return thresholdMs() + ML.STT_THRESHOLD_BONUS_MS; }

  // Chrome 139+ kann on-device erkennen; sonst still auf den Serverweg zurückfallen.
  // Die Antwort gilt für die ganze Sitzung, der Erkenner wird aber jetzt pro
  // Durchgang neu gebaut: einmal fragen, danach synchron anwenden.
  var lokalVerfuegbar = null;   // null = noch keine Antwort
  var lokalAbgefragt = false;

  function requestLocalProcessing(rec) {
    if (typeof SR.available !== 'function') return;
    if (lokalVerfuegbar !== null) {
      if (lokalVerfuegbar) rec.processLocally = true;
      return;
    }
    if (lokalAbgefragt) return;   // Antwort steht noch aus
    lokalAbgefragt = true;
    try {
      Promise.resolve(SR.available({ langs: ['de-DE'], processLocally: true }))
        .then(function (status) {
          if (status === 'available') { lokalVerfuegbar = true; rec.processLocally = true; }
          else if (status === 'downloadable' && typeof SR.install === 'function') {
            SR.install({ langs: ['de-DE'], processLocally: true });
          }
        })
        .catch(function () { /* Serverweg bleibt */ });
    } catch (e) { /* Serverweg bleibt */ }
  }

  // Ein Erkenner pro Zuhör-Durchgang. Die Karte steckt in der Closure, damit
  // jeder Handler weiß, zu welcher Aufgabe sein Durchgang gehört — eine
  // gemeinsame Variable wäre längst überschrieben, wenn ein spätes Ergebnis
  // eintrifft.
  function buildRecognizer(fuerKarte, nr) {
    var rec = new SR();
    rec.lang = 'de-DE';
    rec.continuous = false;
    rec.interimResults = false;
    rec.maxAlternatives = 5;
    requestLocalProcessing(rec);

    // 'start' und 'audiostart' sind der Beleg, dass der Durchgang wirklich
    // läuft. Ohne diesen Beleg wartete der Code früher auf ein 'end', das nie
    // kam.
    function beginnGemeldet(name) {
      if (rec !== stt.recognizer) {
        sttProtokoll(nr, fuerKarte, name + ' verworfen (abgelöst)');
        return;
      }
      if (!stt.gestartet) {
        stt.gestartet = true;
        stt.jeGestartet = true;
        sttProtokoll(nr, fuerKarte, 'gestartet (' + name + ')');
      }
      wachhundStellen(STT_LEBEN_ZEITGRENZE_MS, 'kein Lebenszeichen');
      mikAktualisieren();   // ab hier steht „Jetzt sprechen“
    }

    rec.addEventListener('start', function () { beginnGemeldet('start'); });
    rec.addEventListener('audiostart', function () { beginnGemeldet('audiostart'); });
    // Nur Lebenszeichen, nicht protokolliert — sonst wird die Konsole beim
    // normalen Üben unbrauchbar.
    // Nur der aktuelle Durchgang darf die Anzeige der aktuellen Aufgabe
    // bewegen. Ein abgelöster Erkenner meldet sein Sprechen und sein Ende noch,
    // nachdem der nächste Durchgang längst läuft.
    function fuerAnzeigeGueltig() {
      return rec === stt.recognizer && fuerKarte === session.currentKey;
    }
    function sprechenBegonnen() {
      if (!fuerAnzeigeGueltig()) return;
      mik.spricht = true;
      mik.verarbeitet = false;
      // Was zuletzt gehört wurde, ist überholt, sobald neu gesprochen wird.
      mikEchoLoeschen();
      mikAktualisieren(true);
    }

    rec.addEventListener('soundstart', function () {
      sttLebenszeichen(rec, STT_LEBEN_ZEITGRENZE_MS, 'kein Lebenszeichen');
      sprechenBegonnen();
    });
    rec.addEventListener('speechstart', function () {
      sttLebenszeichen(rec, STT_LEBEN_ZEITGRENZE_MS, 'kein Lebenszeichen');
      sprechenBegonnen();
    });

    rec.addEventListener('speechend', function () {
      // Zeitpunkt VOR der Erkennung — die Erkennungslatenz zählt nicht mit.
      // Diese Zeile bleibt die erste im Handler und darf nichts vor sich haben.
      stt.spokeEndAt = Date.now();
      sttProtokoll(nr, fuerKarte, 'speechend');
      // Auf 'speechend' folgt 'result' oder 'error'; bleibt beides aus, hängt
      // die Erkennung.
      sttLebenszeichen(rec, STT_LEBEN_ZEITGRENZE_MS, 'kein Ergebnis nach speechend');
      if (!fuerAnzeigeGueltig()) return;
      mik.spricht = false;
      mik.verarbeitet = true;
      mikAktualisieren(true);
    });

    rec.addEventListener('result', function (event) {
      sttProtokoll(nr, fuerKarte, 'result');
      sttLebenszeichen(rec, STT_START_ZEITGRENZE_MS, 'kein end nach result');
      // Ergebnisse eines Durchgangs, der zu einer anderen Aufgabe gehört,
      // dürfen diese Aufgabe nicht werten.
      if (fuerKarte !== session.currentKey) {
        sttProtokoll(nr, fuerKarte, 'result verworfen (andere Aufgabe)');
        return;
      }
      mik.spricht = false;
      mik.verarbeitet = false;
      stt.fehlerInFolge = 0;
      var alts = event.results[0];
      var kandidaten = [];
      var kandidatentexte = [];   // nur für die Anzeige, nie für die Wertung
      for (var i = 0; i < alts.length; i++) {
        var zahlen = ML.parseGermanNumbers(alts[i].transcript);
        if (zahlen.length > 0) {
          kandidaten.push(zahlen);
          kandidatentexte.push(alts[i].transcript);
        }
      }
      if (kandidaten.length === 0) {
        // Der Erkenner hat etwas gehört, nur keine Zahl darin. Genau das muss
        // sichtbar werden — sonst rät das Kind, woran es lag.
        mikEchoSetzen(alts.length > 0 ? alts[0].transcript : '');
        mikMelden('fehler', 'Keine Zahl verstanden');
        retryUnderstood('Nicht verstanden — bitte nochmal');
        return;
      }
      // Steht die richtige Zahl irgendwo in irgendeiner Alternative, gilt sie.
      var wert = null;
      var gewaehlt = 0;   // welche Alternative den Wert geliefert hat
      for (var j = 0; j < kandidaten.length && wert === null; j++) {
        if (kandidaten[j].indexOf(session.expected) !== -1) {
          wert = session.expected;
          gewaehlt = j;
        }
      }
      if (wert === null) {
        // Sonst zählt die LETZTE Zahl der ersten Alternative: wer die ganze
        // Rechnung aufsagt, meint mit der letzten Zahl sein Ergebnis.
        var erste = kandidaten[0];
        wert = erste[erste.length - 1];
      }

      // Angezeigt wird der Wortlaut, aus dem der gewertete Wert stammt — auch
      // wenn er falsch ist. Die Meldung muss vor submitAnswer stehen: die
      // nächste Aufgabe folgt sonst im selben Tick und überschreibt sie.
      mikEchoSetzen(kandidatentexte[gewaehlt]);
      mikMelden('verstanden', 'Verstanden: ' + wert);

      var elapsed = Math.max(0, (stt.spokeEndAt || Date.now()) - session.startedAt);
      if (session.startedAt === 0) elapsed = 0;
      submitAnswer(wert, elapsed, sttThresholdMs());
    });

    rec.addEventListener('error', function (event) {
      sttProtokoll(nr, fuerKarte, 'error: ' + event.error);
      // Auf einen Fehler folgt normalerweise 'end'. Bleibt es aus, muss der
      // Wachhund übernehmen.
      sttLebenszeichen(rec, STT_START_ZEITGRENZE_MS, 'kein end nach Fehler');
      // Ein gewöhnlicher Fehler eines veralteten Durchgangs geht diese Aufgabe
      // nichts an. Eine verweigerte Erlaubnis schon: die gilt dem Mikrofon,
      // nicht einer einzelnen Aufgabe.
      if (fuerKarte !== session.currentKey && event.error !== 'not-allowed'
          && event.error !== 'service-not-allowed') {
        sttProtokoll(nr, fuerKarte, 'error verworfen (andere Aufgabe)');
        return;
      }
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        stt.permissionDenied = true;
        setSttActive(false);
        el.feedback.textContent = 'Kein Zugriff auf das Mikrofon — Tastatur geht weiter';
        return;
      }
      // no-speech, audio-capture, network, aborted: nichts werten, neu hören.
      if (event.error === 'aborted') return;   // eigener stopListening()-Aufruf, kein Fehler
      mik.spricht = false;
      mik.verarbeitet = false;
      stt.fehlerInFolge++;
      if (stt.fehlerInFolge >= STT_MAX_FEHLER_IN_FOLGE) {
        setSttActive(false);
        el.feedback.textContent = 'Mikrofon funktioniert gerade nicht — bitte tippen';
        return;
      }
      if (event.error === 'no-speech') {
        mikMelden('fehler', 'Nichts gehört');
        retryUnderstood('Nichts gehört — bitte nochmal');
      } else {
        mikMelden('fehler', 'Mikrofon-Problem');
        retryUnderstood('Mikrofon-Problem — bitte nochmal');
      }
    });

    rec.addEventListener('end', function () {
      // Nur der aktuelle Durchgang darf sich selbst neu starten. Ein abgelöster
      // Erkenner meldet sein Ende erst, nachdem startListening() den neuen
      // gesetzt hat — würde er hier neu starten, bräche er den frischen
      // Durchgang sofort wieder ab, und das endlos. Er darf auch den Wachhund
      // des neuen Durchgangs nicht abräumen.
      if (rec !== stt.recognizer) {
        sttProtokoll(nr, fuerKarte, 'end verworfen (abgelöst)');
        return;
      }
      sttProtokoll(nr, fuerKarte, 'end');
      // Dieser Durchgang ist beendet; der nächste stellt seinen eigenen Wachhund.
      wachhundLoeschen();
      stt.gestartet = false;
      mik.spricht = false;
      mik.verarbeitet = false;
      // Der Browser beendet nach jedem Ergebnis; bei aktivem Modus neu starten.
      // startListening() prüft selbst, ob Zuhören gerade richtig wäre.
      startListening();
    });

    return rec;
  }

  // Erkennungsfehler werten die Karte NICHT — sie stellen die Aufgabe nur neu.
  function retryUnderstood(message) {
    el.feedback.textContent = message;
    // Die Uhr beginnt von vorn: sonst liefe der zweite Versuch gegen die Zeit
    // des ersten und könnte nie schnell genug sein. Der sichtbare Timer und
    // die Frist müssen mit — ein Kind mit schlechtem Mikrofon darf seinen
    // Lernstand nicht durch Fristabläufe verlieren, die es nie zu sehen bekam.
    session.startedAt = Date.now();
    zeitNeuStellen();
  }

  function startListening() {
    // Hinter dem offenen Menü, während des Vorlesens und während der
    // Fehleranzeige wird nicht zugehört. Ohne diese Sperre startet der
    // 'end'-Handler nach dem abort() aus openMenu() sofort wieder.
    if (!zuhoerenErwartet()) { mikAktualisieren(); return; }
    stopListening();                       // einen noch laufenden Durchgang beenden
    stt.spokeEndAt = 0;
    stt.laufNr++;
    stt.gestartet = false;
    mik.spricht = false;
    mik.verarbeitet = false;
    var nr = stt.laufNr;
    var karte = session.currentKey;
    stt.recognizer = buildRecognizer(karte, nr);
    sttProtokoll(nr, karte, 'Start angefordert');
    try {
      stt.recognizer.start();
    } catch (e) {
      // Früher wurde ein Startfehler kommentarlos geschluckt — danach stand ein
      // Erkenner bereit, der nie ein Ereignis lieferte, und das Mikrofon war
      // endgültig still. Jetzt übernimmt der Wachhund; die kurze Verzögerung
      // verhindert eine Rekursion im selben Tick.
      sttProtokoll(nr, karte, 'start() warf: ' + (e && e.name ? e.name : e));
      wachhundStellen(STT_NEUSTART_VERZOEGERUNG_MS, 'start() warf');
      mikAktualisieren();
      return;
    }
    wachhundStellen(sttStartFrist(), 'kein Start-Ereignis');
    mikAktualisieren();   // „Mikrofon startet …“ bis der Beginn bestätigt ist
  }

  function stopListening() {
    // Hier wird bewusst nicht zugehört — also hat auch der Wachhund zu ruhen.
    wachhundLoeschen();
    stt.gestartet = false;
    mik.spricht = false;
    mik.verarbeitet = false;
    mikAktualisieren();
    if (!stt.recognizer) return;
    try { stt.recognizer.abort(); } catch (e) { /* nicht gestartet */ }
  }

  function setSttActive(on) {
    stt.active = on;
    // Der Mikrofonzustand wird bewusst NICHT gespeichert: der Browser verlangt
    // in jeder Sitzung eine neue Erlaubnis-Geste, ein wiederhergestelltes "an"
    // wäre also gelogen. Das Feld bleibt im Schema auf seinem Vorgabewert.
    renderSttButton();
    // startListening() baut den Erkenner selbst — pro Durchgang einen frischen.
    if (on) startListening();
    else stopListening();
    // Das Ein- und Ausschalten ist eine bewusste Handlung: sie räumt auch eine
    // noch stehende kurzlebige Meldung ab.
    if (!on) mikEchoLoeschen();
    mikAktualisieren(true);
    // Mit dem Mikrofon ändert sich die geltende Zeitschwelle (Bonus) und damit
    // die Gesamtfrist. Die Uhr selbst bleibt stehen, wo sie steht.
    zeitNeuStellen();
  }

  var sttButton = null;
  if (stt.supported) {
    sttButton = document.createElement('button');
    sttButton.id = 'stt-toggle';
    sttButton.type = 'button';
    sttButton.textContent = '🎤';
    sttButton.title = 'Antwort sprechen';
    if (!stt.secure) {
      sttButton.disabled = true;
      sttButton.title = 'Das Mikrofon braucht HTTPS — über GitHub Pages oder localhost öffnen';
    }
    el.toolbar.appendChild(sttButton);
    sttButton.addEventListener('click', function () {
      if (!stt.secure || stt.permissionDenied) return;
      setSttActive(!stt.active);
    });
  }

  function renderSttButton() {
    if (!sttButton) return;
    sttButton.setAttribute('aria-pressed', stt.active ? 'true' : 'false');
    sttButton.disabled = !stt.secure || stt.permissionDenied;
  }

  var menuButton = document.createElement('button');
  menuButton.id = 'menu-button';
  menuButton.type = 'button';
  menuButton.textContent = '☰';
  menuButton.title = 'Profile und Einstellungen';
  el.toolbar.appendChild(menuButton);

  function renderStats() {
    var p = profile();
    var boxes = ML.boxVerteilung(p);
    var timed = [];
    ML.ALL_CARD_KEYS.forEach(function (k) {
      var c = p.cards[k];
      if (c && c.bestMs !== null && c.box < ML.BOX_MASTERED) timed.push({ key: k, ms: c.bestMs });
    });
    timed.sort(function (a, b) { return b.ms - a.ms; });

    var html = '<div>offen: <strong>' + ML.openCount(p) + '</strong> von 100' +
               ' &middot; gemeistert: <strong>' + boxes[ML.BOX_MASTERED] + '</strong></div>' +
               '<div>Antworten insgesamt: ' + p.stats.totalAnswers +
               ' &middot; Sitzungen: ' + p.stats.sessions + '</div>';

    if (timed.length > 0) {
      html += '<div style="margin-top:.6rem">Langsamste offene Aufgaben</div><table>';
      timed.slice(0, 5).forEach(function (row) {
        var ab = ML.parseCardKey(row.key);
        html += '<tr><td>' + ab.a + ' × ' + ab.b + '</td><td>' +
                ML.zeitText(row.ms) + '</td></tr>';
      });
      html += '</table>';
    }
    el.stats.innerHTML = html;
  }

  // Was eine Box bedeutet — in einem Satz, den auch ein Kind versteht. Die
  // Reihenfolge ist die Boxnummer. Die Auffrischungsfristen kommen aus
  // REFRESH_INTERVALS_MS, damit der Text nicht vom Code abweichen kann.
  var AUFFRISCHUNGSTAGE = ML.REFRESH_INTERVALS_MS.map(function (ms) {
    return ms / ML.DAY_MS;
  }).join(', dann ');

  var BOX_ERKLAERUNGEN = [
    'Noch nie richtig und schnell genug beantwortet — oder zuletzt danebengegangen.',
    'Einmal richtig und schnell genug geschafft.',
    'Zweimal hintereinander richtig und schnell genug — fehlt noch einmal.',
    'Dreimal geschafft. Kommt nur noch zur Auffrischung dran: nach ' +
      AUFFRISCHUNGSTAGE + ' Tagen.'
  ];

  var BOXREGELN =
    'So wandern die Aufgaben: richtig und schnell genug — eine Box weiter. ' +
    'Richtig, aber zu langsam — die Aufgabe bleibt stehen, geht aber auch nicht ' +
    'zurück. Falsch — zurück in Box 0. Ein ↻ statt des Hakens heißt: Diese ' +
    'gemeisterte Aufgabe ist zur Auffrischung fällig.';

  var DETAIL_HINWEIS = 'Tippe eine Aufgabe an, um zu sehen, wie sie steht.';

  // Macht aus einem Element ein gefülltes Kartengefäß. Wird für die Legende
  // und für jede der 100 Rasterzellen gebraucht.
  function stufeAusstatten(elem, box, faellig) {
    elem.classList.add('stufe', 'stufe-' + box);
    var fuellung = document.createElement('span');
    fuellung.className = 'fuellung';
    elem.appendChild(fuellung);
    if (box === ML.BOX_MASTERED) {
      var zeichen = document.createElement('span');
      zeichen.className = 'zeichen';
      zeichen.textContent = faellig ? '↻' : '✓';
      elem.appendChild(zeichen);
    }
    return elem;
  }

  function renderBoxlegende() {
    var boxes = ML.boxVerteilung(profile());
    el.boxlegende.innerHTML = '';
    BOX_ERKLAERUNGEN.forEach(function (erklaerung, box) {
      var li = document.createElement('li');
      li.appendChild(stufeAusstatten(document.createElement('span'), box, false));

      var text = document.createElement('span');
      text.className = 'text';
      var kopf = document.createElement('span');
      kopf.className = 'kopf';
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = ML.BOX_NAMEN[box] + ' · Box ' + box;
      var anzahl = document.createElement('span');
      anzahl.className = 'anzahl';
      anzahl.textContent = boxes[box] === 1 ? '1 Aufgabe' : boxes[box] + ' Aufgaben';
      kopf.appendChild(name);
      kopf.appendChild(anzahl);

      var satz = document.createElement('span');
      satz.className = 'erklaerung';
      satz.textContent = erklaerung;

      text.appendChild(kopf);
      text.appendChild(document.createElement('br'));
      text.appendChild(satz);
      li.appendChild(text);
      el.boxlegende.appendChild(li);
    });
    el.boxregeln.textContent = BOXREGELN;
  }

  // Das 10×10-Raster: Zeile = erster Faktor, Spalte = zweiter Faktor.
  // Zeigt nur an — es wertet nichts und schreibt nichts.
  function renderRaster() {
    var ansichten = ML.kartenAnsichten(profile(), Date.now());
    var nachKey = {};
    ansichten.forEach(function (v) { nachKey[v.key] = v; });

    var tabelle = document.createElement('table');
    var kopfzeile = document.createElement('tr');
    var ecke = document.createElement('th');
    ecke.scope = 'col';
    ecke.textContent = '×';
    kopfzeile.appendChild(ecke);
    var a, b, th;
    for (b = 1; b <= 10; b++) {
      th = document.createElement('th');
      th.scope = 'col';
      th.textContent = b;
      kopfzeile.appendChild(th);
    }
    var thead = document.createElement('thead');
    thead.appendChild(kopfzeile);
    tabelle.appendChild(thead);

    var tbody = document.createElement('tbody');
    for (a = 1; a <= 10; a++) {
      var tr = document.createElement('tr');
      var zeilenkopf = document.createElement('th');
      zeilenkopf.scope = 'row';
      zeilenkopf.textContent = a;
      tr.appendChild(zeilenkopf);
      for (b = 1; b <= 10; b++) {
        var v = nachKey[ML.cardKey(a, b)];
        var td = document.createElement('td');
        var knopf = document.createElement('button');
        knopf.type = 'button';
        knopf.className = 'karte';
        // Der Satz trägt die Zelle für Maus, Vorlesehilfe und Tippen
        // gleichermaßen — auf dem Tablet gibt es kein title-Fähnchen.
        knopf.title = v.beschreibung;
        knopf.setAttribute('aria-label', v.beschreibung);
        knopf.setAttribute('data-beschreibung', v.beschreibung);
        stufeAusstatten(knopf, v.box, v.faellig);
        td.appendChild(knopf);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    tabelle.appendChild(tbody);

    el.kartenraster.innerHTML = '';
    el.kartenraster.appendChild(tabelle);
    // Ein neu gebautes Raster hat keine Auswahl mehr.
    el.kartendetail.textContent = DETAIL_HINWEIS;
    el.kartendetail.classList.remove('aktiv');
  }

  el.kartenraster.addEventListener('click', function (ev) {
    var knopf = ev.target.closest('.karte');
    if (!knopf) return;
    var vorher = el.kartenraster.querySelector('.karte.gewaehlt');
    if (vorher) vorher.classList.remove('gewaehlt');
    knopf.classList.add('gewaehlt');
    el.kartendetail.textContent = knopf.getAttribute('data-beschreibung');
    el.kartendetail.classList.add('aktiv');
  });

  function renderMenu() {
    el.profileSelect.innerHTML = '';
    Object.keys(state.profiles).forEach(function (id) {
      var opt = document.createElement('option');
      opt.value = id;
      opt.textContent = state.profiles[id].name;
      if (id === state.activeProfile) opt.selected = true;
      el.profileSelect.appendChild(opt);
    });
    el.threshold.value = (thresholdMs() / 1000).toString();
    el.profileDelete.disabled = Object.keys(state.profiles).length <= 1;
    // Ein scharfgeschaltetes Löschen darf keinen Kontextwechsel überleben.
    loeschBestaetigung = false;
    el.profileDelete.textContent = 'Löschen';
    renderStats();
    renderBoxlegende();
    renderRaster();
  }

  function openMenu() {
    // Hinter dem Menü darf weder die Uhr noch das Mikrofon weiterlaufen.
    // Ein Fristablauf hinter dem offenen Menü wäre ein zerstörter Lernstand
    // ohne jede Handlung des Kindes.
    zeitStopp();
    stopListening();
    renderMenu();
    el.menu.hidden = false;
    // Erst jetzt ist das Menü offen — der Status muss danach neu gerechnet
    // werden, sonst stünde er noch auf „Jetzt sprechen“.
    mikAktualisieren(true);
  }

  function closeMenu() {
    el.menu.hidden = true;
    el.trainer.hidden = session.currentKey === null;
    el.done.hidden = session.currentKey !== null;
    // Die wartende Aufgabe wird ab der Rückkehr gemessen, nicht ab vorher.
    // Der Timer zieht mit; im Menü kann die Zeitschwelle geändert worden sein.
    if (session.currentKey !== null) session.startedAt = Date.now();
    zeitNeuStellen();
    el.answer.focus();
    if (stt.active) startListening();   // Mikrofon war während des Menüs gesperrt
    else mikAktualisieren();
  }

  function restartSession() {
    zeitStopp();
    stopListening();
    stt.spokeEndAt = 0;
    session.recent = [];
    session.answered = 0;
    session.refreshesShown = 0;
    session.freeplay = false;
    session.awaitingAck = false;
    session.ausFreiemUeben = false;
    // Nach einem Profilwechsel zählt die erste Antwort als Sitzung des neuen Profils.
    session.sitzungGezaehlt = false;
    el.done.hidden = true;
    el.trainer.hidden = false;
    renderTtsButton();
    renderSttButton();
    nextQuestion();
  }

  menuButton.addEventListener('click', openMenu);
  el.menuClose.addEventListener('click', closeMenu);

  el.profileSelect.addEventListener('change', function () {
    state.activeProfile = el.profileSelect.value;
    persist();
    renderMenu();
    restartSession();
    el.menu.hidden = false;   // Menü bleibt offen, Wechsel ist sichtbar
  });

  el.profileAdd.addEventListener('click', function () {
    var name = el.profileName.value.trim();
    if (name === '') return;
    var created = ML.createProfile(state, name, Date.now());
    state = created.state;
    persist();
    el.profileName.value = '';
    renderMenu();
    restartSession();
    el.menu.hidden = false;
  });

  el.profileDelete.addEventListener('click', function () {
    if (Object.keys(state.profiles).length <= 1) return;
    if (!loeschBestaetigung) {
      // Erster Klick fragt nur nach; ein Profil sind Wochen an Lernstand.
      loeschBestaetigung = true;
      el.profileDelete.textContent = 'Wirklich löschen?';
      return;
    }
    state = ML.deleteProfile(state, el.profileSelect.value);
    persist();
    renderMenu();
    restartSession();
    el.menu.hidden = false;
  });

  el.threshold.addEventListener('change', function () {
    var seconds = parseFloat(el.threshold.value);
    if (isNaN(seconds) || seconds < 1 || seconds > 30) { renderMenu(); return; }
    profile().settings.thresholdMs = Math.round(seconds * 1000);
    persist();
  });

  // Die Sitzung wird erst bei der ersten Antwort gezählt (siehe submitAnswer).
  renderTtsButton();
  renderSttButton();
  nextQuestion();

  window.__app = { session: session, nextQuestion: nextQuestion,
                   submitAnswer: submitAnswer, render: render,
                   profile: profile, persist: persist,
                   renderMenu: renderMenu, openMenu: openMenu, closeMenu: closeMenu,
                   renderRaster: renderRaster, renderStats: renderStats,
                   renderTtsButton: renderTtsButton, speak: speak,
                   stt: stt, setSttActive: setSttActive,
                   startListening: startListening, stopListening: stopListening,
                   mik: mik, mikAktualisieren: mikAktualisieren,
                   zeit: zeit, zeitAktualisieren: zeitAktualisieren,
                   zeitNeuStellen: zeitNeuStellen, zeitStopp: zeitStopp,
                   zeitFristAbgelaufen: zeitFristAbgelaufen,
                   zeitSchwelleMs: zeitSchwelleMs, zeitLaeuft: zeitLaeuft,
                   thresholdMs: thresholdMs, sttThresholdMs: sttThresholdMs,
                   flash: flash, retryUnderstood: retryUnderstood };
})();
</script>
</body>
</html>
