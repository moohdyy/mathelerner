  // time. The refresh intervals come from REFRESH_INTERVALS_MS so that the
  // text cannot diverge from the code.
  function refreshDaysText() {
    return ML.REFRESH_INTERVALS_MS.map(function (ms) {
      return ms / ML.DAY_MS;
    }).join(t('box.refreshDaysJoin'));
  }

  function boxExplanation(box) {
    return t('box.explain.' + box, { days: refreshDaysText() });
  }

  // Turns an element into a filled card vessel. Needed for the legend and for
  // each of the 100 grid cells.
  function buildLevel(elem, box, refreshDue) {
    elem.classList.add('level', 'level-' + box);
    var fill = document.createElement('span');
    fill.className = 'fill';
    elem.appendChild(fill);
    if (box === ML.BOX_MASTERED) {
      var symbol = document.createElement('span');
      symbol.className = 'symbol';
      symbol.textContent = refreshDue ? '↻' : '✓';
      elem.appendChild(symbol);
    }
    return elem;
  }

  function renderBoxLegend() {
    var boxes = ML.boxDistribution(profile());
    var names = ML.boxNames(lang());
    el.boxLegend.innerHTML = '';
    for (var box = 0; box <= ML.BOX_MASTERED; box++) {
      var li = document.createElement('li');
      li.appendChild(buildLevel(document.createElement('span'), box, false));

      var text = document.createElement('span');
      text.className = 'text';
      var head = document.createElement('span');
      head.className = 'head';
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = t('box.legendName', { name: names[box], box: box });
      var count = document.createElement('span');
      count.className = 'count';
      count.textContent = t('box.count', { n: boxes[box] });
      head.appendChild(name);
      head.appendChild(count);

      var sentence = document.createElement('span');
      sentence.className = 'explanation';
      sentence.textContent = boxExplanation(box);

      text.appendChild(head);
      text.appendChild(document.createElement('br'));
      text.appendChild(sentence);
      li.appendChild(text);
      el.boxLegend.appendChild(li);
    }
    el.boxRules.textContent = t('box.rules');
  }

  // The 10×10 grid: row = first factor, column = second factor.
  // It only displays — it grades nothing and writes nothing.
  function renderGrid() {
    var views = ML.cardViews(profile(), Date.now(), lang());
    var byKey = {};
    views.forEach(function (v) { byKey[v.key] = v; });

    var table = document.createElement('table');
    var headRow = document.createElement('tr');
    var corner = document.createElement('th');
    corner.scope = 'col';
    corner.textContent = '×';
    headRow.appendChild(corner);
    var selectedRows = rows();
    var a, b, th;
    for (b = 1; b <= 10; b++) {
      th = document.createElement('th');
      th.scope = 'col';
      th.textContent = b;
      if (selectedRows.indexOf(b) !== -1) th.className = 'on';
      headRow.appendChild(th);
    }
    var thead = document.createElement('thead');
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    for (a = 1; a <= 10; a++) {
      var tr = document.createElement('tr');
      var rowHead = document.createElement('th');
      rowHead.scope = 'row';
      rowHead.textContent = a;
      if (selectedRows.indexOf(a) !== -1) rowHead.className = 'on';
      tr.appendChild(rowHead);
      for (b = 1; b <= 10; b++) {
        var v = byKey[ML.cardKey(a, b)];
        var td = document.createElement('td');
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'card';
        // The sentence carries the cell for mouse, screen reader and tapping
        // alike — on a tablet there is no title tooltip.
        button.title = v.description;
        button.setAttribute('aria-label', v.description);
        button.setAttribute('data-description', v.description);
        if (!v.selected) button.classList.add('resting');
        buildLevel(button, v.box, v.refreshDue);
        td.appendChild(button);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);

    el.cardGrid.innerHTML = '';
    el.cardGrid.appendChild(table);
    // A freshly built grid no longer has a selection.
    el.cardDetail.textContent = t('grid.hint');
    el.cardDetail.classList.remove('active');
  }

  el.cardGrid.addEventListener('click', function (ev) {
    var button = ev.target.closest('.card');
    if (!button) return;
    var previous = el.cardGrid.querySelector('.card.selected');
    if (previous) previous.classList.remove('selected');
    button.classList.add('selected');
    el.cardDetail.textContent = button.getAttribute('data-description');
    el.cardDetail.classList.add('active');
  });

  // The row picker. Rebuilt whole on every change: ten buttons cost nothing,
  // and a single source for their state cannot drift apart from the setting.
  function renderRows() {
    var selected = rows();
    el.rowPicker.innerHTML = '';
    ML.ALL_ROWS.forEach(function (n) {
      var button = document.createElement('button');
      button.type = 'button';
      button.textContent = n;
      button.setAttribute('data-row', n);
      button.setAttribute('aria-pressed', selected.indexOf(n) !== -1 ? 'true' : 'false');
      button.setAttribute('aria-label', t('rows.rowLabel', { n: n }));
      el.rowPicker.appendChild(button);
    });
    el.rowsCount.textContent = t('rows.count', { n: ML.selectedCardKeys(selected).length });
    el.rowsHint.textContent = t('rows.hint');
  }

  // One way in for every change of the selection. It touches no card and does
  // not start the clock: this happens with the menu open, where the clock is
  // stopped anyway, and closeMenu starts it again — exactly as after a
  // language change.
  function setRows(next) {
    profile().settings.rows = next;
    persist();
    el.rowsNote.hidden = true;
    renderRows();
    renderStats();
    renderBoxLegend();
    renderGrid();
    render();
  }

  el.rowPicker.addEventListener('click', function (ev) {
    var button = ev.target.closest('button[data-row]');
    if (!button) return;
    var n = parseInt(button.getAttribute('data-row'), 10);
    var current = rows();
    var next = ML.toggleRow(current, n);
    if (current.indexOf(n) !== -1 && next.length === current.length) {
      // The last remaining row was tapped: nothing changes, and saying so is
      // better than a switch that silently refuses.
      el.rowsNote.textContent = t('rows.lastOne');
      el.rowsNote.hidden = false;
      return;
    }
    setRows(next);
  });

  el.rowsAll.addEventListener('click', function () { setRows(ML.ALL_ROWS.slice()); });
  el.rowsHard.addEventListener('click', function () { setRows(ML.HARD_ROWS.slice()); });

  function renderLanguageSelect() {
    el.language.innerHTML = '';
    ML.LANGUAGES.forEach(function (entry) {
      var opt = document.createElement('option');
      opt.value = entry.id;
      // The label stays in its own language on purpose: whoever cannot read
      // the interface still finds „English“ in a German menu.
      opt.textContent = entry.label;
      if (entry.id === lang()) opt.selected = true;
      el.language.appendChild(opt);
    });
  }

  function renderMenu() {
    el.profileSelect.innerHTML = '';
    Object.keys(state.profiles).forEach(function (id) {
      var opt = document.createElement('option');
      opt.value = id;
      opt.textContent = state.profiles[id].name;
      if (id === state.activeProfile) opt.selected = true;
      el.profileSelect.appendChild(opt);
    });
    el.threshold.value = (thresholdMs() / 1000).toString();
    renderLanguageSelect();
    el.profileDelete.disabled = Object.keys(state.profiles).length <= 1;
    // An armed delete must not survive a change of context.
    deleteConfirmPending = false;
    el.profileDelete.textContent = t('menu.delete');
    renderRows();
    el.rowsNote.hidden = true;
    renderStats();
    renderBoxLegend();
    renderGrid();
  }

  function openMenu() {
    // Behind the menu neither the clock nor the microphone may keep running.
    // A deadline expiring behind the open menu would be destroyed progress
    // without any action by the child.
    stopClock();
    stopListening();
    renderMenu();
    el.menu.hidden = false;
    // Only now is the menu open — the status has to be recomputed afterwards,
    // otherwise it would still show the mic.ready text.
    micUpdate(true);
  }

  function closeMenu() {
    el.menu.hidden = true;
    // A question whose row was switched off in the menu must not be asked any
    // more. It is dropped ungraded — changing the selection never changes a
    // card. nextQuestion sets the clock, the reading and the microphone, so
    // nothing else happens here. A waiting acknowledgement keeps its question:
    // the child is looking at the solution of an answer already given.
    if (session.currentKey !== null && !session.awaitingAck &&
        !cardInRows(session.currentKey)) {
      el.trainer.hidden = false;
      el.done.hidden = true;
      nextQuestion();
      return;
    }
    el.trainer.hidden = session.currentKey === null;
    el.done.hidden = session.currentKey !== null;
    // The waiting question is measured from the return, not from before.
    // The timer follows; the time threshold may have been changed in the menu.
    if (session.currentKey !== null) session.startedAt = Date.now();
    rearmDeadline();
    el.answer.focus();
    if (stt.active) startListening();   // the microphone was locked while the menu was open
    else micUpdate();
  }

  function restartSession() {
    stopClock();
    stopListening();
    stt.spokeEndAt = 0;
    session.recent = [];
    session.answered = 0;
    session.refreshesShown = 0;
    session.freeplay = false;
    session.awaitingAck = false;
    session.ackTimeUp = false;
    session.fromFreePlay = false;
    // After a profile switch the first answer counts as a session of the new profile.
    session.sessionCounted = false;
    el.done.hidden = true;
    el.trainer.hidden = false;
    renderTtsButton();
    renderSttButton();
    nextQuestion();
  }

  menuButton.addEventListener('click', openMenu);
  el.menuClose.addEventListener('click', closeMenu);

  el.profileSelect.addEventListener('change', function () {
    state.activeProfile = el.profileSelect.value;
    persist();
    applyLanguage();   // the language belongs to the profile and switches with it
    renderMenu();
    restartSession();
    el.menu.hidden = false;   // the menu stays open, the switch is visible
  });

  el.profileAdd.addEventListener('click', function () {
    var name = el.profileName.value.trim();
    if (name === '') return;
    // A profile created in the menu inherits the language of the one that is
    // active: whoever operates the menu is reading it in that language, which
    // is the better guess than the browser setting.
    var inherited = lang();
    var created = ML.createProfile(state, name, Date.now(), inherited);
    state = created.state;
    persist();
    applyLanguage();
    el.profileName.value = '';
    renderMenu();
    restartSession();
    el.menu.hidden = false;
  });

  el.profileDelete.addEventListener('click', function () {
    if (Object.keys(state.profiles).length <= 1) return;
    if (!deleteConfirmPending) {
      // The first click only asks; a profile is weeks of progress.
      deleteConfirmPending = true;
      el.profileDelete.textContent = t('menu.deleteConfirm');
      return;
    }
    state = ML.deleteProfile(state, el.profileSelect.value);
    persist();
    applyLanguage();   // deleting makes another profile active
    renderMenu();
    restartSession();
    el.menu.hidden = false;
  });

  el.threshold.addEventListener('change', function () {
    var seconds = parseFloat(el.threshold.value);
    if (isNaN(seconds) || seconds < 1 || seconds > 30) { renderMenu(); return; }
    profile().settings.thresholdMs = Math.round(seconds * 1000);
    persist();
  });

  // A language change touches no card. It happens with the menu open, so the
  // clock is stopped anyway — closeMenu starts it again through updateTimer,
  // exactly as after every other visit to the menu. No new place stops or
  // starts the clock here.
  el.language.addEventListener('change', function () {
    var chosen = ML.resolveLanguage(el.language.value);
    profile().settings.lang = chosen;
    persist();

    applyLanguage();        // static texts, <html lang>, title, voice
    relabelQuestion();      // the waiting question keeps its factors, not its texts
    render();               // progress line
    renderMenu();           // stats, legend, rules, grid, detail, delete button, selector

    // rec.lang is set when the recogniser is built and does not change on a
    // running one. Discarding it is enough: closeMenu starts listening again
    // and buildRecognizer then reads the new speech tag. Without this the
    // child would speak English and be recognised in German.
    stopListening();
    micUpdate(true);
  });

  // The toolbar buttons are created above, so this call catches them too;
  // document.title and <html lang> are right from the first paint on.
  applyLanguage();

  // The session is only counted on the first answer (see submitAnswer).
  renderTtsButton();
  renderSttButton();
  nextQuestion();

  window.__app = { session: session, nextQuestion: nextQuestion,
                   submitAnswer: submitAnswer, render: render,
                   profile: profile, persist: persist,
                   lang: lang, t: t, applyLanguage: applyLanguage,
                   ackFeedbackText: ackFeedbackText,
                   relabelQuestion: relabelQuestion,
                   renderLanguageSelect: renderLanguageSelect,
                   rows: rows, setRows: setRows, renderRows: renderRows,
                   renderMenu: renderMenu, openMenu: openMenu, closeMenu: closeMenu,
                   renderGrid: renderGrid, renderStats: renderStats,
                   renderTtsButton: renderTtsButton, speak: speak,
                   stt: stt, setSttActive: setSttActive,
                   startListening: startListening, stopListening: stopListening,
                   mic: mic, micUpdate: micUpdate,
                   timer: timer, updateTimer: updateTimer,
                   rearmDeadline: rearmDeadline, stopClock: stopClock,
                   onDeadlineExpired: onDeadlineExpired,
                   currentThresholdMs: currentThresholdMs, clockRunning: clockRunning,
                   thresholdMs: thresholdMs, sttThresholdMs: sttThresholdMs,
                   showFlash: showFlash, retryUnderstood: retryUnderstood };
})();
</script>
</body>
</html>
