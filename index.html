<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<!-- Tab icon embedded directly: a multiplication sign on a green tile in the
     colours from :root (--ok and --bg). As a data URI it keeps the app at
     exactly two shipped files, and the browser stops asking for
     /favicon.ico. The "#" of the colour values has to be encoded as %23. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232e7d32'/%3E%3Cpath d='M10 10L22 22M22 10L10 22' stroke='%23fbfbfa' stroke-width='5.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fbfbfa; --fg: #1a1a1a; --muted: #8a8a85;
    --ok: #2e7d32; --bad: #c62828; --line: #e3e3df;
    /* Only for the grace phase of the timer. Green and red are reserved for
       grading an answer — a timer in the same colours would mean two
       different things in the same place. */
    --warn: #a35a00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --fg: #f0f0ee; --muted: #85858c;
            --ok: #6dd47e; --bad: #ff6b6b; --line: #2c2d31;
            --warn: #e0a24a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 400 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3vh; padding: 4vh 5vw;
    -webkit-text-size-adjust: 100%;
  }
  /* Feedback on the answer.
     Before, only the colour of the question changed for 260 ms — in exactly
     the place the eye has long left while answering. Now the whole surface
     colours up and fades softly back to the background.
     Two signals, not one: colour AND symbol. Whoever tells green and red
     apart poorly still reads ✓ or ✗ in the middle of the screen.
     Muted, not garish: the peak sits at barely a quarter opacity, and the
     fade-out lasts four times as long as the rise. A full-screen flashing
     background would be inappropriate for children. */
  #flash {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  #flash .surface {
    position: absolute; inset: 0; opacity: 0; background: var(--ok);
  }
  #flash .symbol {
    position: relative; opacity: 0; line-height: 1; font-weight: 300;
    font-size: clamp(6rem, 30vw, 15rem); color: var(--ok);
  }
  #flash.bad .surface { background: var(--bad); }
  #flash.bad .symbol { color: var(--bad); }
  @keyframes flash-surface {
    0% { opacity: 0 } 14% { opacity: .22 } 100% { opacity: 0 }
  }
  @keyframes flash-symbol {
    0%   { opacity: 0; transform: scale(.86) }
    16%  { opacity: 1; transform: scale(1) }
    55%  { opacity: .9; transform: scale(1) }
    100% { opacity: 0; transform: scale(1.05) }
  }
  #flash.ok .surface, #flash.bad .surface { animation: flash-surface .72s ease-out both; }
  #flash.ok .symbol, #flash.bad .symbol { animation: flash-symbol .72s ease-out both; }

  /* Without motion: the same statement, only without the size change and with
     a flatter peak — the flash should not come across as a twitch there. */
  @keyframes flash-surface-calm {
    0% { opacity: 0 } 30% { opacity: .16 } 100% { opacity: 0 }
  }
  @keyframes flash-symbol-calm {
    0% { opacity: 0 } 30% { opacity: .95 } 70% { opacity: .95 } 100% { opacity: 0 }
  }
  @media (prefers-reduced-motion: reduce) {
    #flash.ok .surface, #flash.bad .surface { animation-name: flash-surface-calm; }
    #flash.ok .symbol, #flash.bad .symbol { animation-name: flash-symbol-calm; }
  }

  /* The running timer. A flat bar right below the question that empties from
     right to left. The mark sits where the fast time ends and the grace period
     begins — once the bar reaches it the question can still be saved, it just
     no longer moves up a box.
     Two signals here as well: the colour changes from grey to amber AND the
     bar grows thicker. Calm enough not to rush, and without a number —
     readable without reading. */
  #timerbar { position: relative; width: min(22rem, 80vw); height: 1rem; flex: none; }
  #timer-track, #timer-fill {
    position: absolute; top: 50%; left: 0;
    border-radius: 999px; transform: translateY(-50%);
  }
  #timer-track { right: 0; height: .3rem; background: var(--line); }
  #timer-fill {
    width: 100%; height: .3rem; background: var(--muted);
    transition: height .25s ease, background-color .25s ease;
  }
  #timerbar.grace #timer-fill { height: .62rem; background: var(--warn); }
  /* When the clock stands still — the question is being read out, the menu is
     open, the solution waits for acknowledgement — the fill disappears into
     the track. The bar stays in place so that nothing jumps, but says nothing. */
  #timerbar.idle #timer-fill { background: var(--line); height: .3rem; }
  #timer-mark {
    position: absolute; top: 50%; left: 66.667%; width: 2px; height: .78rem;
    transform: translate(-50%, -50%); border-radius: 1px; background: var(--bg);
  }
  @media (prefers-reduced-motion: reduce) {
    #timer-fill { transition: none; }
  }

  #question {
    font-size: clamp(3rem, 18vw, 9rem); font-weight: 300;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    transition: color .12s ease; text-align: center;
  }
  #answer {
    font-family: inherit;
    font-size: clamp(2rem, 10vw, 4.5rem);
    font-weight: 300;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    width: 4.5ch; text-align: center; padding: .1em .1em .15em;
    background: transparent; color: inherit;
    border: none; border-bottom: 3px solid var(--line); border-radius: 0;
  }
  #answer:focus { outline: none; border-bottom-color: var(--fg); }
  #confirm {
    font: inherit; font-size: 1.1rem;
    width: min(22rem, 80vw); padding: .8rem 1rem; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: .6rem;
  }
  #confirm:active { color: var(--fg); border-color: var(--fg); }
  #feedback { min-height: 1.6em; font-size: 1.1rem; color: var(--muted); text-align: center; }

  /* Microphone status display. A single object — a five-part level meter —
     carries every state through shape, motion and colour; the words only
     support it. A child has to recognise from two metres away whether it may
     speak, without reading. No frame, no shadow: the page has none elsewhere
     either. The height is fixed so that no state change shifts the question. */
  #mic-status {
    display: flex; align-items: center; gap: .85rem;
    height: 3.4rem; color: var(--muted);
  }
  #mic-level { display: flex; align-items: center; gap: .3rem; flex: none; }
  #mic-level i {
    display: block; width: .34rem; height: 2.1rem; border-radius: .17rem;
    background: currentColor; opacity: .5;
    transform: scaleY(.28); transform-origin: center;
  }
  #mic-texts { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
  #mic-state { font-size: 1.25rem; line-height: 1.25; }
  #mic-heard {
    font-size: .95rem; line-height: 1.25; min-height: 1.25em; color: var(--muted);
    /* Wide enough that a spelled-out „siebenundzwanzig“ fits completely, and
       narrow enough that the line does not run off the edge on a phone. */
    max-width: min(30ch, 68vw);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Green means speak, red means it went wrong, grey means wait. */
  #mic-status.ready, #mic-status.hearing { color: var(--ok); }
  #mic-status.understood { color: var(--fg); }
  #mic-status.error { color: var(--bad); }

  @keyframes mic-breathe { 0%, 100% { transform: scaleY(.28); opacity: .4 }
                           50%      { transform: scaleY(.55); opacity: 1 } }
  @keyframes mic-bars    { 0%, 100% { transform: scaleY(.24); opacity: .55 }
                           50%      { transform: scaleY(1);   opacity: 1 } }
  @keyframes mic-wave    { 0%, 55%, 100% { transform: scaleY(.24); opacity: .35 }
                           25%           { transform: scaleY(.78); opacity: 1 } }

  /* Ready: a calm, even breath — switched on, but quiet. */
  #mic-status.ready i { animation: mic-breathe 2.2s ease-in-out infinite; }
  /* Hearing: the bars dance. Different durations instead of delays, so that
     they never run in sync again and it looks alive instead of metered. */
  #mic-status.hearing i { animation: mic-bars .6s ease-in-out infinite; }
  #mic-status.hearing i:nth-child(1) { animation-duration: .52s; }
  #mic-status.hearing i:nth-child(2) { animation-duration: .79s; }
  #mic-status.hearing i:nth-child(3) { animation-duration: .43s; }
  #mic-status.hearing i:nth-child(4) { animation-duration: .67s; }
  #mic-status.hearing i:nth-child(5) { animation-duration: .57s; }
  /* Processing: a wave runs through — work, no longer listening. */
  #mic-status.processing i { animation: mic-wave 1.15s ease-in-out infinite; }
  #mic-status.processing i:nth-child(2) { animation-delay: .12s; }
  #mic-status.processing i:nth-child(3) { animation-delay: .24s; }
  #mic-status.processing i:nth-child(4) { animation-delay: .36s; }
  #mic-status.processing i:nth-child(5) { animation-delay: .48s; }
  /* Arrived: all bars stand full. Error: all of them lie flat. */
  #mic-status.understood i { transform: scaleY(1); opacity: 1; }
  #mic-status.error i { transform: scaleY(.28); opacity: .9; }

  @media (prefers-reduced-motion: reduce) {
    /* Without motion the shapes have to carry the states. */
    #mic-level i { animation: none !important; }
    #mic-status.ready i { transform: scaleY(.55); opacity: 1; }
    #mic-status.hearing i { opacity: 1; }
    #mic-status.hearing i:nth-child(1) { transform: scaleY(.42); }
    #mic-status.hearing i:nth-child(2) { transform: scaleY(.86); }
    #mic-status.hearing i:nth-child(3) { transform: scaleY(.55); }
    #mic-status.hearing i:nth-child(4) { transform: scaleY(1); }
    #mic-status.hearing i:nth-child(5) { transform: scaleY(.6); }
    #mic-status.processing i { opacity: .9; }
    #mic-status.processing i:nth-child(odd) { transform: scaleY(.62); }
  }
  #progress { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  #storage-warning {
    font-size: .9rem; color: var(--bad); text-align: center; max-width: 32ch;
  }
  #toolbar { position: fixed; top: 1rem; right: 1rem; display: flex; gap: .4rem; }
  #toolbar button {
    font-size: 1.1rem; line-height: 1; padding: .45rem .55rem; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: .5rem;
  }
  #toolbar button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
  #toolbar button[disabled] { opacity: .35; cursor: not-allowed; }
  #trainer {
    display: flex; flex-direction: column; align-items: center; gap: 3vh;
  }
  #done { text-align: center; max-width: 32ch; }
  /* The menu is a full-screen overlay and has to sit above everything. The
     z-index is not decoration: ever since the timer bar became
     `position: relative` and the flash sits at z-index 5, both are positioned
     and would otherwise win against the menu, which is only `fixed` — the
     running bar and a red ✗ stood in the middle of the settings. Before the
     timer there was no positioned element inside the trainer, which is why
     this did not show up earlier. */
  #menu {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    padding: 6vh 5vw; overflow: auto;
    display: flex; flex-direction: column; gap: 1.4rem; align-items: flex-start;
  }
  /* The menu is a scrolling column. Without this `flex: none` flexbox squashes
     tall children as soon as the content grows longer than the screen — the
     question grid was squeezed to a third of its height and cut off that way. */
  #menu > * { flex: none; }
  #menu h2 { font-size: 1rem; font-weight: 600; margin: 0; }
  #menu label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: .3rem; }
  #menu select, #menu input[type="number"], #menu input[type="text"] {
    font: inherit; padding: .45rem .6rem; background: transparent; color: inherit;
    border: 1px solid var(--line); border-radius: .5rem;
  }
  #menu button {
    font: inherit; padding: .45rem .8rem; cursor: pointer;
    background: transparent; color: inherit;
    border: 1px solid var(--line); border-radius: .5rem;
  }
  .row { display: flex; gap: .5rem; align-items: flex-end; flex-wrap: wrap; }
  #menu p { margin: 0; }
  /* The version sits in the bottom right corner and stays quiet. The menu is
     a column with `align-items: flex-start`, so the line has to stretch
     before `text-align: right` has anything to push against; `margin-top:
     auto` keeps it at the bottom while the menu is shorter than the screen.
     Two ids, otherwise `#menu p { margin: 0 }` above would win. */
  #menu #version {
    align-self: stretch; margin-top: auto; text-align: right;
    font-size: .75rem; color: var(--muted); opacity: .7;
  }
  #stats { font-size: .9rem; color: var(--muted); line-height: 1.7; }
  #stats table { border-collapse: collapse; margin-top: .5rem; }
  #stats td { padding: .1rem .8rem .1rem 0; font-variant-numeric: tabular-nums; }

  /* Box levels. A card is a grey vessel that fills up further with every hit —
     the difference is carried by the fill level, not by the colour. Whoever
     cannot tell green from grey still sees it: 0, 38, 70, 100 per cent are
     four different shapes, and the mastered card additionally carries a symbol.
     The rules hang off #menu, otherwise `#menu button` wins against them with
     its `background` and `border` shorthands. */
  #menu .level {
    position: relative; flex: none; overflow: hidden;
    width: 1.5rem; height: 1.5rem;
    border: 1px solid var(--line); border-radius: .28rem;
    background: var(--line);
  }
  #menu .level .fill {
    position: absolute; left: 0; right: 0; bottom: 0; background: var(--ok);
  }
  #menu .level-0 .fill { height: 0; }
  #menu .level-1 .fill { height: 38%; opacity: .45; }
  #menu .level-2 .fill { height: 70%; opacity: .72; }
  #menu .level-3 .fill { height: 100%; opacity: 1; }
  #menu .level .symbol {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    color: var(--bg); font-size: .8em; line-height: 1;
  }

  /* The row picker. Ten square switches in the same vessel language as the
     card grid, so that a switched-off row reads like a card that is not being
     asked. Two signals again, never colour alone: a selected row is drawn
     with a solid border in the text colour, a resting one with a dashed
     border and muted digits. At least 2.75rem so a child's finger hits it. */
  #row-picker { display: flex; flex-wrap: wrap; gap: .4rem; }
  #menu #row-picker button {
    width: 2.75rem; height: 2.75rem; padding: 0;
    font-size: 1rem; font-variant-numeric: tabular-nums;
    color: var(--muted); border-style: dashed;
  }
  #menu #row-picker button[aria-pressed="true"] {
    color: var(--fg); border-color: var(--fg); border-style: solid;
  }
  #rows-count { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  #rows-note { font-size: .9rem; color: var(--warn); }
  #rows-hint { font-size: .9rem; color: var(--muted); line-height: 1.6; max-width: 46ch; }

  #box-legend {
    list-style: none; margin: 0; padding: 0; width: 100%; max-width: 34rem;
    display: flex; flex-direction: column; gap: .95rem; font-size: .9rem;
  }
  #box-legend li { display: flex; gap: .65rem; align-items: flex-start; }
  #box-legend .level { margin-top: .15rem; }
  #box-legend .text { flex: 1; min-width: 0; }
  #box-legend .head { display: flex; gap: .6rem; justify-content: space-between; }
  #box-legend .name { color: var(--fg); font-weight: 600; }
  #box-legend .count {
    color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  #box-legend .explanation { color: var(--muted); line-height: 1.45; }
  #box-rules { font-size: .9rem; color: var(--muted); line-height: 1.6; max-width: 46ch; }

  /* The grid: row = first factor, column = second factor. Fixed table width so
     that all eleven columns fit even at 360 px. */
  #card-grid { width: 100%; max-width: 24rem; overflow-x: auto; }
  #card-grid table {
    width: 100%; table-layout: fixed;
    border-collapse: separate; border-spacing: 2px;
  }
  #card-grid th {
    padding: 0; text-align: center; font-weight: 400; font-size: .72rem;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  #card-grid thead th:first-child { width: 1.4rem; }
  #card-grid td { padding: 0; }
  /* Square via the padding trick, not via `aspect-ratio`: inside a table cell
     with `table-layout: fixed` the width is still undetermined while the
     height is computed, and Chrome then falls back to the content height
     (measured: 27.8 × 24 px instead of square). The percentage padding, by
     contrast, refers to the width of the cell. The 2 px are the border — with
     `box-sizing: border-box` it counts towards the height. */
  #menu #card-grid .card {
    display: block; width: 100%; height: 0; padding: 0 0 calc(100% - 2px);
    font-size: .78rem; cursor: pointer;
  }
  #menu #card-grid .card.selected { outline: 2px solid var(--fg); outline-offset: 1px; }
  /* A card of a switched-off row: still there, its progress still visible, but
     visibly not in play. The vessel is emptied out — no grey body, only a
     dashed outline, dashed like the switch that parked it. A dashed border
     alone was not enough: on the filled cell it was invisible at 1 px
     (measured in the browser, not guessed). */
  #menu #card-grid .card.resting {
    background: transparent; border-style: dashed; opacity: .65;
  }
  /* The heading numbers say which rows are in play, so the grid can be read
     without counting cells. */
  #card-grid th.on { color: var(--fg); }
  #card-detail {
    font-size: .9rem; color: var(--muted); line-height: 1.5;
    min-height: 3em; max-width: 46ch;
  }
  #card-detail.active { color: var(--fg); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="toolbar"></div>

<section id="menu" hidden>
  <h2 data-i18n="menu.profile"></h2>
  <div class="row">
    <div>
      <label for="profile-select" data-i18n="menu.activeProfile"></label>
      <select id="profile-select"></select>
    </div>
    <!-- No data-i18n: the text alternates between menu.delete and
         menu.deleteConfirm and is set by renderMenu(). -->
    <button id="profile-delete"></button>
  </div>
  <div class="row">
    <div>
      <label for="profile-name" data-i18n="menu.newProfile"></label>
      <input id="profile-name" type="text" autocomplete="off"
             data-i18n-placeholder="menu.namePlaceholder">
    </div>
    <button id="profile-add" data-i18n="menu.add"></button>
  </div>

  <h2 data-i18n="menu.settings"></h2>
  <div>
    <label for="threshold" data-i18n="menu.threshold"></label>
    <input id="threshold" type="number" min="1" max="30" step="0.5">
  </div>
  <div>
    <label for="language" data-i18n="menu.language"></label>
    <select id="language"></select>
  </div>

  <h2 data-i18n="menu.rows"></h2>
  <div id="row-picker" role="group" data-i18n-aria-label="menu.rows"></div>
  <div class="row">
    <button id="rows-all" type="button" data-i18n="rows.all"></button>
    <button id="rows-hard" type="button" data-i18n="rows.hard"></button>
  </div>
  <p id="rows-count"></p>
  <p id="rows-note" hidden></p>
  <p id="rows-hint"></p>

  <h2 data-i18n="menu.progress"></h2>
  <div id="stats"></div>

  <h2 data-i18n="menu.allCards"></h2>
  <ul id="box-legend"></ul>
  <p id="box-rules"></p>
  <div id="card-grid"></div>
  <p id="card-detail" aria-live="polite"></p>

  <button id="menu-close" data-i18n="menu.close"></button>

  <!-- No data-i18n: the line carries a parameter, so applyLanguage() cannot
       fill it from the attribute alone; showVersion() does it instead. -->
  <p id="version"></p>
</section>

<main id="trainer">
  <div id="question" aria-live="polite">&nbsp;</div>
  <!-- The timer is pure display: aria-hidden, so that the screen reader does
       not interrupt on every repaint. What counts is said by the text in
       #feedback. -->
  <div id="timerbar" class="idle" aria-hidden="true">
    <span id="timer-track"></span>
    <span id="timer-fill"></span>
    <span id="timer-mark"></span>
  </div>
  <div id="mic-status" hidden>
    <span id="mic-level" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    <span id="mic-texts">
      <span id="mic-state" aria-live="polite"></span>
      <span id="mic-heard" aria-live="polite"></span>
    </span>
  </div>
  <input id="answer" type="text" inputmode="numeric" autocomplete="off"
         autocorrect="off" spellcheck="false" data-i18n-aria-label="trainer.answerLabel">
  <button id="confirm" type="button"></button>
  <div id="feedback" aria-live="polite"></div>
</main>

<div id="done" hidden>
  <p data-i18n="done.all"></p>
  <button id="freeplay" data-i18n="done.freeplay"></button>
</div>

<div id="progress"></div>
<div id="storage-warning" hidden></div>

<!-- The flash lies above everything and intercepts nothing (pointer-events:
     none). aria-hidden, because the symbol says the same as #feedback. -->
<div id="flash" aria-hidden="true">
  <span class="surface"></span>
  <span class="symbol"></span>
</div>

<script src="logic.js"></script>
<script>
(function () {
  'use strict';

  var el = {
    question: document.getElementById('question'),
    answer: document.getElementById('answer'),
    confirm: document.getElementById('confirm'),
    feedback: document.getElementById('feedback'),
    timerbar: document.getElementById('timerbar'),
    timerFill: document.getElementById('timer-fill'),
    timerMark: document.getElementById('timer-mark'),
    flash: document.getElementById('flash'),
    flashSymbol: document.querySelector('#flash .symbol'),
    micStatus: document.getElementById('mic-status'),
    micState: document.getElementById('mic-state'),
    micHeard: document.getElementById('mic-heard'),
    progress: document.getElementById('progress'),
    storageWarning: document.getElementById('storage-warning'),
    version: document.getElementById('version'),
    trainer: document.getElementById('trainer'),
    done: document.getElementById('done'),
    freeplay: document.getElementById('freeplay'),
    menu: document.getElementById('menu'),
    toolbar: document.getElementById('toolbar'),
    profileSelect: document.getElementById('profile-select'),
    profileName: document.getElementById('profile-name'),
    profileAdd: document.getElementById('profile-add'),
    profileDelete: document.getElementById('profile-delete'),
    threshold: document.getElementById('threshold'),
    language: document.getElementById('language'),
    rowPicker: document.getElementById('row-picker'),
    rowsAll: document.getElementById('rows-all'),
    rowsHard: document.getElementById('rows-hard'),
    rowsCount: document.getElementById('rows-count'),
    rowsNote: document.getElementById('rows-note'),
    rowsHint: document.getElementById('rows-hint'),
    menuClose: document.getElementById('menu-close'),
    stats: document.getElementById('stats'),
    boxLegend: document.getElementById('box-legend'),
    boxRules: document.getElementById('box-rules'),
    cardGrid: document.getElementById('card-grid'),
    cardDetail: document.getElementById('card-detail')
  };

  // The browser's language decides only for a profile that is created new —
  // never for one that was loaded. A stored profile comes from an earlier run
  // and keeps the language it was set to.
  var browserLanguage = ML.resolveLanguage(
    (typeof navigator !== 'undefined' && navigator.language) || null);

  var state = ML.loadState(window.localStorage);
  if (!state.activeProfile) {
    var created = ML.createProfile(state, ML.t(browserLanguage, 'profile.defaultName'),
                                   Date.now(), browserLanguage);
    state = created.state;
    ML.saveState(window.localStorage, state);
  }

  var session = {
    currentKey: null,
    expected: 0,
    startedAt: 0,
    recent: [],
    answered: 0,
    refreshesShown: 0,
    awaitingAck: false,    // waits for acknowledgement after a mistake
    ackTimeUp: false,      // the standing acknowledgement came from the deadline
    freeplay: false,
    fromFreePlay: false,   // the current card comes from free practice
    sessionCounted: false  // only the first answer makes this a session
  };

  // Two-step confirmation for deleting a profile.
  var deleteConfirmPending = false;

  function profile() { return state.profiles[state.activeProfile]; }

  /* ---------- language ---------- */

  function lang() { return profile().settings.lang; }

  // Short bridge to ML.t so that every call site reads the same and nobody
  // has to remember to pass the language.
  function t(key, params) { return ML.t(lang(), key, params); }

  // Attribute texts: the data attribute names the key, the second entry the
  // attribute it fills.
  var I18N_ATTRS = [
    ['data-i18n-placeholder', 'placeholder'],
    ['data-i18n-title', 'title'],
    ['data-i18n-aria-label', 'aria-label']
  ];

  // Rewrites every marked node. Called at startup, on a language change and
  // after a profile switch. Elements created in script carry the same data
  // attributes, so the buttons in the toolbar are covered too — including the
  // case where their title names the unsupported variant of the key.
  function applyLanguage() {
    document.documentElement.lang = ML.locale(lang()).htmlLang;
    document.title = t('app.title');

    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = t(nodes[i].getAttribute('data-i18n'));
    }
    el.version.textContent = t('menu.version', { version: ML.VERSION });
    for (var a = 0; a < I18N_ATTRS.length; a++) {
      var marked = document.querySelectorAll('[' + I18N_ATTRS[a][0] + ']');
      for (var j = 0; j < marked.length; j++) {
        marked[j].setAttribute(I18N_ATTRS[a][1],
          t(marked[j].getAttribute(I18N_ATTRS[a][0])));
      }
    }
    pickVoice();
  }

  var storageWarningShown = false;
  function persist() {
    var ok = ML.saveState(window.localStorage, state);
    if (!ok && !storageWarningShown) {
      storageWarningShown = true;
      // Its own element: #feedback is rewritten on every answer and would have
      // overwritten the warning in the very same tick. Marked with
      // data-i18n so a later language change updates it too — it is not in
      // the initial markup and applyLanguage() would otherwise never reach it.
      el.storageWarning.setAttribute('data-i18n', 'storage.warning');
      el.storageWarning.textContent = t('storage.warning');
      el.storageWarning.hidden = false;
    }
  }

  function thresholdMs() { return profile().settings.thresholdMs; }
  // The selected rows, always healed — a damaged stored value asks everything
  // instead of nothing.
  function rows() { return ML.normalizeRows(profile().settings.rows); }
  function cardInRows(key) {
    var ab = ML.parseCardKey(key);
    return ML.cardSelected(ab.a, ab.b, rows());
  }

  // How long the flash lasts. Has to match the two CSS animations — they are
  // set to .72s.
  var FLASH_DURATION_MS = 720;
  var flashTimer = null;

  // The whole surface colours up briefly and fades softly back to the
  // background; the symbol in the middle says the same again without colour.
  // `kind` is 'ok' or 'bad'.
  function showFlash(kind) {
    if (flashTimer !== null) clearTimeout(flashTimer);
    el.flash.className = '';
    el.flashSymbol.textContent = kind === 'ok' ? '✓' : '✗';
    // Without this forced reflow the animation does not restart on two answers
    // in quick succession: the class was never really gone within the same
    // tick, and the browser sees no change.
    void el.flash.offsetWidth;
    el.flash.className = kind;
    flashTimer = setTimeout(function () {
      flashTimer = null;
      el.flash.className = '';
    }, FLASH_DURATION_MS);
  }

  /* ---------- Visible timer and overall deadline ---------- */

  // Two clocks, but only one measure: drawing happens per repaint, the
  // deadline hangs off its own setTimeout. Both places compute from
  // `Date.now() - session.startedAt` — never from a number of ticks. In a
  // background tab requestAnimationFrame does not run at all and setTimeout is
  // throttled; only real timestamps survive that.
  //
  // The display does not replace the time measurement. Grading is still done
  // solely from the measured time via gradeAnswer.
  var timer = {
    base: 0,        // which session.startedAt the timer is currently set for
    deadline: null, // handle of the deadline timeout
    frame: null,    // handle of the drawing loop
    fired: false    // so that a deadline takes effect exactly once
  };

  var reducedMotion = typeof window.matchMedia === 'function'
    ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;

  // Which threshold currently applies. In voice mode the bonus counts, since
  // otherwise the bar would run against a different time than is graded.
  function currentThresholdMs() {
    return stt.active ? sttThresholdMs() : thresholdMs();
  }

  // The single question of whether the clock may run at all right now.
  // `session.startedAt === 0` means "not running yet" — the question is being
  // read out. Behind the open menu and during the error display nothing runs
  // either.
  function clockRunning() {
    return session.currentKey !== null && !session.awaitingAck
        && el.menu.hidden && session.startedAt !== 0;
  }

  function stopClock() {
    if (timer.deadline !== null) { clearTimeout(timer.deadline); timer.deadline = null; }
    if (timer.frame !== null) { window.cancelAnimationFrame(timer.frame); timer.frame = null; }
    timer.base = 0;
    el.timerbar.className = 'idle';
    el.timerFill.style.width = '100%';
  }

  function drawTimer() {
    var d = ML.timeDisplay(Date.now() - session.startedAt, currentThresholdMs());
    // Without motion the bar jumps in twentieths instead of gliding: it stays
    // readable without running all the time.
    var fraction = reducedMotion ? Math.ceil(d.fraction * 20) / 20 : d.fraction;
    el.timerFill.style.width = (fraction * 100).toFixed(2) + '%';
    el.timerbar.className = d.phase === ML.TIME_FAST ? 'fast' : 'grace';
  }

  function timerLoop() {
    timer.frame = null;
    if (!clockRunning()) return;
    drawTimer();
    timer.frame = window.requestAnimationFrame(timerLoop);
  }

  // The only way to set the timer. It checks by itself whether measuring is
  // going on right now and may therefore be called from every state change —
  // exactly that keeps display and grading from drifting apart.
  function updateTimer() {
    if (!clockRunning()) { stopClock(); return; }
    if (timer.base === session.startedAt && timer.deadline !== null) return;   // already running
    if (timer.deadline !== null) { clearTimeout(timer.deadline); timer.deadline = null; }
    if (timer.frame !== null) { window.cancelAnimationFrame(timer.frame); timer.frame = null; }

    var threshold = currentThresholdMs();
    var total = ML.deadlineMs(threshold);
    el.timerMark.style.left = (ML.timeDisplay(0, threshold).thresholdFraction * 100) + '%';
    if (total <= 0) { stopClock(); return; }   // unusable threshold: no deadline

    timer.base = session.startedAt;
    timer.fired = false;
    // The deadline counts from startedAt, not from now: when it is re-armed in
    // the middle of a question — the microphone changes the applicable
    // threshold — the time already elapsed stays elapsed.
    var remaining = total - (Date.now() - session.startedAt);
    timer.deadline = setTimeout(onDeadlineExpired, Math.max(0, remaining));
    drawTimer();
    timer.frame = window.requestAnimationFrame(timerLoop);
  }

  // Forces the deadline to be re-armed without touching the clock itself.
  // Needed when the applicable threshold changes mid-question.
  function rearmDeadline() {
    timer.base = 0;
    updateTimer();
  }

  // The deadline has expired: the question counts as wrong. Grading happens
  // exclusively through submitAnswer — there must not be a second route into
  // the storage layer, otherwise two places change a card and one of them will
  // eventually be wrong.
  function onDeadlineExpired() {
    timer.deadline = null;
    if (timer.fired) return;             // exactly once
    if (!clockRunning()) return;         // menu open, error display, reading out
    var threshold = currentThresholdMs();
    var total = ML.deadlineMs(threshold);
    if (total <= 0) return;
    var elapsed = Date.now() - session.startedAt;
    if (elapsed < total) {
      // The timer came too early — for instance because the applicable
      // threshold has grown meanwhile. The real time is graded, never the
      // tick: re-arm.
      timer.deadline = setTimeout(onDeadlineExpired, total - elapsed);
      return;
    }
    timer.fired = true;
    // First go silent, then grade: a recognition result arriving afterwards
    // must not touch the already graded card a second time.
    stopListening();
    submitAnswer(null, elapsed, threshold, true);
  }

  function render() {
    el.progress.textContent = t('trainer.progress', {
      n: ML.openCount(profile()), total: ML.selectedCardKeys(rows()).length
    });
  }

  function nextQuestion() {
    var key = ML.pickNext(profile().cards, {
      now: Date.now(),
      recent: session.recent,
      answered: session.answered,
      refreshesShown: session.refreshesShown,
      rows: rows(),
      rng: Math.random
    });

    if (key === null && !session.freeplay) {
      session.currentKey = null;
      el.trainer.hidden = true;
      el.done.hidden = false;
      render();
      micUpdate();
      updateTimer();   // no deadline runs on the completion screen
      return;
    }
    var fromFreePlay = false;
    if (key === null) {
      // Free practice: draw from the selected cards with equal weight. A
      // switched-off row stays switched off here too — otherwise the rows a
      // child deliberately parked would come back through the back door.
      var all = ML.selectedCardKeys(rows());
      key = all[Math.floor(Math.random() * all.length)];
      fromFreePlay = true;
    }

    // Only real refreshes scheduled by pickNext count against the quota.
    if (!fromFreePlay && profile().cards[key].box === ML.BOX_MASTERED) {
      session.refreshesShown++;
    }

    var ab = ML.parseCardKey(key);
    session.currentKey = key;
    session.expected = ab.a * ab.b;
    session.startedAt = Date.now();
    session.awaitingAck = false;
    session.ackTimeUp = false;
    session.fromFreePlay = fromFreePlay;

    el.question.textContent = ab.a + ' × ' + ab.b;
    el.answer.value = '';
    el.feedback.textContent = '';
    el.confirm.textContent = t('trainer.ok');
    // Do not focus the invisible field behind the open menu — on a phone that
    // pulled the numeric keyboard up over the menu.
    if (el.menu.hidden) el.answer.focus();
    render();

    if (profile().settings.tts && tts.unlocked) {
      // Clock and microphone only start once the question has been read out.
      session.startedAt = 0;
      isReadingAloud = true;
      stopListening();
      speak(ML.spokenQuestion(ab.a, ab.b, lang()), function () {
        isReadingAloud = false;
        if (session.currentKey !== key) {
          // The question has changed meanwhile: this callback must not touch
          // the clock of the new question. It still has to start listening —
          // otherwise the microphone stays silent, because the isReadingAloud
          // lock rejected every earlier startListening() call.
          startListening();
          return;
        }
        session.startedAt = Date.now();
        updateTimer();   // only now does the visible timer start
        startListening();
      });
    } else {
      isReadingAloud = false;
      if (stt.active) startListening();
      else micUpdate();
    }
    // Last, so that both branches are covered: in the reading branch startedAt
    // is 0 and the bar rests, otherwise it runs from here on.
    updateTimer();
  }

  // The sentence that stands while the mistake is shown. Its own function
  // because a language change has to be able to rewrite it.
  function ackFeedbackText() {
    return t(session.ackTimeUp ? 'trainer.wrongTimeUp' : 'trainer.wrong',
             { expected: session.expected });
  }

  // The factors stay, the texts do not: the button label and a standing
  // acknowledgement have to follow the language.
  function relabelQuestion() {
    if (session.currentKey === null) return;
    if (session.awaitingAck) {
      el.feedback.textContent = ackFeedbackText();
      el.confirm.textContent = t('trainer.next');
    } else {
      el.feedback.textContent = '';
      el.confirm.textContent = t('trainer.ok');
    }
  }

  // elapsedMs can be overridden (voice mode measures differently).
  // `timeUp` comes exclusively from the deadline: there is no value then, and
  // the question is wrong without further checks. The deadline deliberately
  // has no route of its own into the storage layer but passes through here —
  // there must be only one place that grades a card.
  function submitAnswer(value, elapsedMs, overrideThresholdMs, timeUp) {
    if (session.currentKey === null || session.awaitingAck) return;
    if (!timeUp && (value === null || isNaN(value))) return;   // not understood: do not grade

    // Grading starts here: the clock must not keep running alongside and
    // strike a second time right away.
    stopClock();

    var elapsed = typeof elapsedMs === 'number'
      ? elapsedMs
      : (session.startedAt === 0 ? 0 : Date.now() - session.startedAt);
    var correct = !timeUp && value === session.expected;
    var p = profile();

    if (!session.sessionCounted) {
      // Per spec a session is a page visit WITH at least one answer.
      p.stats.sessions++;
      session.sessionCounted = true;
    }

    if (session.fromFreePlay) {
      // Per spec free practice runs without any box effect: the card is not
      // graded, there is only the feedback.
      p.stats.totalAnswers++;
    } else {
      p.cards[session.currentKey] = ML.gradeAnswer(p.cards[session.currentKey], {
        correct: correct, elapsedMs: elapsed,
        thresholdMs: typeof overrideThresholdMs === 'number' ? overrideThresholdMs : thresholdMs(),
        now: Date.now()
      });
      p.stats.totalAnswers++;
    }

    session.recent.push(session.currentKey);
    if (session.recent.length > ML.RECENT_MEMORY) session.recent.shift();
    session.answered++;
    persist();

    if (correct) {
      showFlash('ok');
      nextQuestion();
    } else {
      showFlash('bad');
      session.ackTimeUp = timeUp;
      el.feedback.textContent = ackFeedbackText();
      el.confirm.textContent = t('trainer.next');
      session.awaitingAck = true;
      stopListening();   // do not listen while the mistake is shown
      render();
    }
  }

  // Enter and the wide touch area do exactly the same — one function for both,
  // so that they cannot drift apart.
  function confirmAnswer() {
    if (session.awaitingAck) { nextQuestion(); return; }
    var raw = el.answer.value.trim();
    if (!/^\d+$/.test(raw)) return;
    submitAnswer(parseInt(raw, 10));
  }

  el.answer.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    confirmAnswer();
  });

  el.confirm.addEventListener('click', function () {
    confirmAnswer();
    // On a tablet this keeps the keyboard at the field instead of the button.
    if (el.menu.hidden) el.answer.focus();
  });

  el.freeplay.addEventListener('click', function () {
    session.freeplay = true;
    el.done.hidden = true;
    el.trainer.hidden = false;
    nextQuestion();
  });

  /* ---------- Speech output ---------- */

  var tts = {
    supported: typeof window.speechSynthesis !== 'undefined',
    voice: null,
    unlocked: false
  };

  // While the question is being read out the microphone must not listen —
  // otherwise it recognises the app's own speech output as an answer.
  var isReadingAloud = false;

  // Prefers an exact match on the pack's speech tag, then any voice of the
  // same language. Some engines report "en_US" with an underscore.
  function pickVoice() {
    if (!tts.supported) return;
    tts.voice = null;
    var want = ML.locale(lang()).speechLang.toLowerCase();
    var base = want.split('-')[0];
    var voices = window.speechSynthesis.getVoices();
    var i;
    for (i = 0; i < voices.length; i++) {
      if (voices[i].lang && voices[i].lang.toLowerCase().replace('_', '-') === want) {
        tts.voice = voices[i];
        return;
      }
    }
    for (i = 0; i < voices.length; i++) {
      if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(base) === 0) {
        tts.voice = voices[i];
        return;
      }
    }
    // Nothing fitting: the browser's default voice stays, exactly as before.
  }

  if (tts.supported) {
    pickVoice();
    // On the first call the voice list is often still empty.
    window.speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }

  // Some engines stop the speech output without ever reporting onend or
  // onerror — for instance when the tab moves into the background. Without
  // this watchdog the clock would stay at 0 and every answer would count as a
  // hit.
  var SPEECH_TIMEOUT_MS = 5000;

  function speak(text, onEnd) {
    if (!tts.supported) { if (onEnd) onEnd(); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = ML.locale(lang()).speechLang;
    if (tts.voice) u.voice = tts.voice;
    u.rate = 0.95;
    var done = false;
    var watchdog = null;
    function finish() {
      if (done) return;
      done = true;
      if (watchdog !== null) clearTimeout(watchdog);
      if (onEnd) onEnd();
    }
    u.onend = finish;
    u.onerror = finish;   // otherwise the clock would stall on an engine error
    watchdog = setTimeout(finish, SPEECH_TIMEOUT_MS);
    try {
      window.speechSynthesis.speak(u);
    } catch (e) {
      // Some engines throw synchronously; the clock must not stall on that.
      finish();
    }
  }

  var ttsButton = document.createElement('button');
  ttsButton.id = 'tts-toggle';
  ttsButton.type = 'button';
  ttsButton.textContent = '🔊';
  ttsButton.setAttribute('data-i18n-title', 'toolbar.tts');
  if (!tts.supported) {
    ttsButton.disabled = true;
    ttsButton.setAttribute('data-i18n-title', 'toolbar.ttsUnsupported');
  }
  el.toolbar.appendChild(ttsButton);

  function renderTtsButton() {
    // The button only shows "on" when speaking really happens. After a reload
    // the setting is still stored, but the browser first demands a user
    // gesture — until then the button honestly says "off".
    var reallySpeaks = profile().settings.tts && tts.unlocked;
    ttsButton.setAttribute('aria-pressed', reallySpeaks ? 'true' : 'false');
  }

  ttsButton.addEventListener('click', function () {
    if (!tts.supported) return;
    var p = profile();
    if (p.settings.tts && !tts.unlocked) {
      // The setting was stored, only the gesture the browser demands was
      // missing. This click is that gesture — so unlock instead of switching
      // off.
      tts.unlocked = true;
    } else {
      p.settings.tts = !p.settings.tts;
      if (p.settings.tts) tts.unlocked = true;
    }
    persist();
    renderTtsButton();
    if (session.currentKey === null) return;   // completion screen: nothing to read out
    if (p.settings.tts) {
      // This click is the user gesture iOS/Safari demands.
      var key = session.currentKey;
      var ab = ML.parseCardKey(key);
      session.startedAt = 0;
      updateTimer();   // clock stopped: the bar rests too
      isReadingAloud = true;
      stopListening();
      speak(ML.spokenQuestion(ab.a, ab.b, lang()), function () {
        isReadingAloud = false;
        if (session.currentKey !== key) {
          // Question changed: leave the clock alone, but start listening again
          // (see nextQuestion).
          startListening();
          return;
        }
        session.startedAt = Date.now();
        updateTimer();
        startListening();
      });
    } else {
      window.speechSynthesis.cancel();
      session.startedAt = Date.now();
      updateTimer();
    }
  });

  /* ---------- Speech input ---------- */

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  var STT_MAX_CONSECUTIVE_ERRORS = 5;

  // Watchdog of the speech input — the same motive as SPEECH_TIMEOUT_MS for
  // the speech output: restarting the listening hung solely off the 'end'
  // event of the recogniser. If that fails to arrive a single time — because
  // start() had no effect, because start() threw, because the engine hangs —
  // the microphone stays silent for good until the next interaction, while the
  // button keeps showing "on".
  //
  // Until the 'start' event: with permission granted Chrome reports the
  // beginning within a few milliseconds. 3 s leave room for a slow device or
  // network start and are short enough that a child barely notices the gap.
  var STT_START_TIMEOUT_MS = 3000;
  // On the very first run the browser's permission prompt may be open. The
  // watchdog must not interfere for that long, otherwise it switches the
  // microphone off while the adult is still reading the dialog.
  var STT_FIRST_START_TIMEOUT_MS = 30000;
  // After a confirmed start until the next sign of life. Chrome reports
  // 'no-speech' by itself after a few seconds of silence and 'end' after that;
  // the limit has to sit clearly above it so that quiet thinking does not
  // count as a dropout. It is the last resort, not the normal case.
  var STT_ALIVE_TIMEOUT_MS = 20000;
  // Brake against a restart storm when start() throws immediately.
  var STT_RESTART_DELAY_MS = 300;

  var stt = {
    supported: !!SR,
    secure: window.isSecureContext === true && window.location.protocol !== 'file:',
    active: false,
    recognizer: null,
    spokeEndAt: 0,
    voiceEndAt: 0,      // end of speaking from the level detector, 0 = none yet
    permissionDenied: false,
    consecutiveErrors: 0,
    // Bookkeeping about the running listening pass.
    runId: 0,           // running number, makes overlapping passes distinguishable
    started: false,     // has the current pass demonstrably begun?
    everStarted: false, // has one ever begun? Then permission has been granted.
    watchdog: null      // timer handle of the watchdog
  };

  // Pure diagnostics: the log must not change anything about the interaction,
  // must not show anything in the interface and must not influence any state
  // logic. Fixed prefix so that the console can be filtered by it; pass number
  // and card key, because overlapping passes cannot be told apart otherwise —
  // and those are exactly the interesting case.
  function sttLog(runId, card, text) {
    if (typeof console === 'undefined' || !console.log) return;
    console.log('[STT] #' + runId + ' ' + (card === null ? '—' : card) + ' ' + text);
  }

  // What the recogniser actually delivered, on one line: every alternative with
  // its confidence and the numbers the parser finds in it. Without this, a
  // misrecognition cannot be reconstructed afterwards — the log used to say
  // only THAT a result arrived, never which one.
  function sttTranscripts(alts) {
    var parts = [];
    for (var i = 0; i < alts.length; i++) {
      var confidence = typeof alts[i].confidence === 'number'
        ? alts[i].confidence.toFixed(2)
        : '?';
      parts.push('\u201e' + alts[i].transcript + '\u201c\u27e8' + confidence + '\u27e9\u2192['
        + ML.parseNumbers(alts[i].transcript, lang()).join(',') + ']');
    }
    return parts.length === 0 ? '(no alternative)' : parts.join(' | ');
  }

  // Every segment with its isFinal, because that flag decides whether anything
  // may be graded at all. Without it in the log, a prefix graded too early
  // looks exactly like a genuine misrecognition.
  function sttResultLog(results) {
    var parts = [];
    for (var i = 0; i < results.length; i++) {
      parts.push('[' + i + (results[i].isFinal ? ' final' : ' interim') + '] '
        + sttTranscripts(results[i]));
    }
    return parts.length === 0 ? '(no segment)' : parts.join(' || ');
  }

  // The recognition result as plain data — isFinal plus the alternatives in
  // order. No DOM type reaches ML.chooseSpokenAnswer, and nothing here
  // pre-judges which value counts.
  function sttSegments(results) {
    var segments = [];
    for (var i = 0; i < results.length; i++) {
      var alternatives = [];
      for (var a = 0; a < results[i].length; a++) alternatives.push(results[i][a].transcript);
      segments.push({ final: results[i].isFinal === true, alternatives: alternatives });
    }
    return segments;
  }

  /* ---------- Status display of the microphone ---------- */

  // The display is pure feedback: it grades no card, submits no answer and
  // does not touch the time measurement. Two building blocks:
  //
  //   1. The ongoing state is derived from the situation (ML.micState) and
  //      recomputed on every event.
  //   2. The short-lived messages — understood, not understood, nothing heard
  //      — are set and hold the derivation back for a while. Without that lock
  //      they would be invisible: the next question follows in the same tick,
  //      exactly as with #feedback.
  var MIC_HOLD_MS = 1800;
  // The heard text lives longer than the message: it should still be there
  // while the child is thinking about the next question.
  var MIC_ECHO_MS = 7000;
  var MIC_ECHO_MAX_CHARS = 32;

  var mic = {
    speaking: false,    // between speechstart/soundstart and speechend
    processing: false,  // between speechend and result or error
    holdTimer: null,    // holds a short-lived message in place
    echoTimer: null
  };

  var MIC_TEXT_KEYS = {};
  MIC_TEXT_KEYS[ML.MIC_PAUSED] = 'mic.paused';
  MIC_TEXT_KEYS[ML.MIC_READING] = 'mic.reading';
  MIC_TEXT_KEYS[ML.MIC_STARTING] = 'mic.starting';
  MIC_TEXT_KEYS[ML.MIC_READY] = 'mic.ready';
  MIC_TEXT_KEYS[ML.MIC_HEARING] = 'mic.hearing';
  MIC_TEXT_KEYS[ML.MIC_PROCESSING] = 'mic.processing';

  // Which bar shape belongs to which state. "waiting" is the calm base shape
  // for everything that asks the child to wait.
  var MIC_SHAPES = {};
  MIC_SHAPES[ML.MIC_PAUSED] = 'waiting';
  MIC_SHAPES[ML.MIC_READING] = 'waiting';
  MIC_SHAPES[ML.MIC_STARTING] = 'waiting';
  MIC_SHAPES[ML.MIC_READY] = 'ready';
  MIC_SHAPES[ML.MIC_HEARING] = 'hearing';
  MIC_SHAPES[ML.MIC_PROCESSING] = 'processing';

  function micWrite(shape, text) {
    el.micStatus.hidden = false;
    el.micStatus.className = shape;
    el.micState.textContent = text;
  }

  function micClearHold() {
    if (mic.holdTimer === null) return;
    clearTimeout(mic.holdTimer);
    mic.holdTimer = null;
  }

  // Sets a short-lived message and holds it in place. A call with force behind
  // it (micUpdate(true)) clears it again at any time.
  function micReport(shape, text) {
    micClearHold();
    micWrite(shape, text);
    mic.holdTimer = setTimeout(function () {
      mic.holdTimer = null;
      micUpdate();
    }, MIC_HOLD_MS);
  }

  function micUpdate(force) {
    if (force) micClearHold();
    else if (mic.holdTimer !== null) return;   // a short-lived message still stands
    var state = ML.micState({
      active: stt.supported && stt.secure && stt.active,
      paused: !el.menu.hidden || session.awaitingAck || session.currentKey === null,
      reading: isReadingAloud,
      processing: mic.processing,
      speaking: mic.speaking,
      started: stt.started
    });
    if (state === ML.MIC_OFF) {
      // Off means gone: a grey line without a statement only distracts while
      // typing.
      el.micStatus.hidden = true;
      el.micStatus.className = '';
      el.micState.textContent = '';
      micClearEcho();
      return;
    }
    micWrite(MIC_SHAPES[state], t(MIC_TEXT_KEYS[state]));
  }

  function micClearEcho() {
    if (mic.echoTimer !== null) { clearTimeout(mic.echoTimer); mic.echoTimer = null; }
    el.micHeard.textContent = '';
  }

  // Shows what the recogniser understood — also, and especially, when it was
  // wrong. textContent, never innerHTML: the text comes from outside.
  function micSetEcho(text) {
    micClearEcho();
    var clean = String(text === null || text === undefined ? '' : text).trim();
    if (clean === '') return;
    if (clean.length > MIC_ECHO_MAX_CHARS) {
      clean = clean.slice(0, MIC_ECHO_MAX_CHARS) + '…';
    }
    el.micHeard.textContent = t('mic.heard', { text: clean });
    mic.echoTimer = setTimeout(function () {
      mic.echoTimer = null;
      el.micHeard.textContent = '';
    }, MIC_ECHO_MS);
  }

  // The single question of whether listening should happen at all right now.
  // In every other state silence is correct, and the watchdog has to keep
  // quiet.
  function shouldListen() {
    return stt.active && !isReadingAloud && el.menu.hidden
        && !session.awaitingAck && session.currentKey !== null;
  }

  function clearWatchdog() {
    if (stt.watchdog === null) return;
    clearTimeout(stt.watchdog);
    stt.watchdog = null;
  }

  // Arms the watchdog for the current pass. A superseded pass can thereby
  // neither clear the watchdog of a new one nor trigger it: the number is
  // captured when arming and checked when it strikes.
  function armWatchdog(delay, reason) {
    clearWatchdog();
    var runId = stt.runId;
    var card = session.currentKey;
    stt.watchdog = setTimeout(function () {
      stt.watchdog = null;
      if (runId !== stt.runId) {
        sttLog(runId, card, 'watchdog discarded (superseded)');
        return;
      }
      if (!shouldListen()) {
        sttLog(runId, card, 'watchdog quiet (rightly not listening)');
        return;
      }
      // The watchdog NEVER grades a card and NEVER submits an answer — it only
      // restarts the listening. It pays into the same brake as the recogniser
      // errors, otherwise it would fire endlessly offline or with a broken
      // microphone.
      stt.consecutiveErrors++;
      if (stt.consecutiveErrors >= STT_MAX_CONSECUTIVE_ERRORS) {
        sttLog(runId, card, 'watchdog gives up after ' + stt.consecutiveErrors + ' attempts');
        setSttActive(false);
        el.feedback.textContent = t('mic.broken');
        return;
      }
      sttLog(runId, card, 'watchdog: ' + reason + ' — restart (' + stt.consecutiveErrors + ')');
      startListening();
    }, delay);
  }

  // Every event of the current pass is a sign of life and resets the deadline.
  // Events of a superseded recogniser have no effect.
  function sttHeartbeat(rec, delay, reason) {
    if (rec !== stt.recognizer) return;
    armWatchdog(delay, reason);
  }

  function sttStartTimeout() {
    return stt.everStarted ? STT_START_TIMEOUT_MS : STT_FIRST_START_TIMEOUT_MS;
  }

  function sttThresholdMs() { return thresholdMs() + ML.STT_THRESHOLD_BONUS_MS; }

  // Chrome 139+ can recognise on-device; otherwise fall back to the server
  // route silently. The recogniser is built per pass: ask once per speech
  // tag, then apply synchronously.
  // The answer applies per speech tag, not per session: that German is
  // available locally says nothing about English.
  var localAvailable = {};   // speechLang -> true/false, absent = no answer yet
  var localQueried = {};

  function requestLocalProcessing(rec) {
    if (typeof SR.available !== 'function') return;
    var tag = ML.locale(lang()).speechLang;
    if (localAvailable[tag] !== undefined) {
      if (localAvailable[tag]) rec.processLocally = true;
      return;
    }
    if (localQueried[tag]) return;   // the answer is still pending
    localQueried[tag] = true;
    try {
      Promise.resolve(SR.available({ langs: [tag], processLocally: true }))
        .then(function (status) {
          if (status === 'available') {
            localAvailable[tag] = true;
            rec.processLocally = true;
          } else if (status === 'downloadable' && typeof SR.install === 'function') {
            SR.install({ langs: [tag], processLocally: true });
          }
        })
        .catch(function () { /* the server route stays */ });
    } catch (e) { /* the server route stays */ }
  }

  // One recogniser per listening pass. The card sits in the closure so that
  // every handler knows which question its pass belongs to — a shared variable
  // would long be overwritten by the time a late result arrives.
  function buildRecognizer(forCard, runId) {
    var rec = new SR();
    rec.lang = ML.locale(lang()).speechLang;
    // Continuous, and that is not a detail: in single-utterance mode Chrome's
    // recogniser drops a short utterance without a trace — no result, no
    // nomatch, no error, just a silent end. Measured with "sechs": three
    // attempts, zero results, while "sechsunddreißig" came through every time.
    // The card then ran into the deadline and was graded WRONG although the
    // child had answered correctly. Continuously the same word arrives with
    // confidence 1.00.
    //
    // The price is that 'speechend' now fires once for the whole pass instead
    // of once per utterance — the time measurement therefore hangs on the
    // first sign of recognition, see stt.spokeEndAt.
    rec.continuous = true;
    // The on-device recogniser streams its result as growing prefixes and
    // ignores a false here — observed as "4" seconds before "45". Asking for
    // interim results makes that visible instead of pretending it does not
    // happen: they feed the display, and ML.chooseSpokenAnswer keeps them out
    // of the grading.
    rec.interimResults = true;
    rec.maxAlternatives = 5;
    requestLocalProcessing(rec);

    // What this pass has seen. Per pass, not shared: a late event of a
    // superseded recogniser must not be able to report anything about the
    // current one.
    var pass = {
      segments: [],     // latest snapshot of the recognition result
      consumed: 0,      // segments of utterances already reported on
      sawSpeech: false, // was there speech since the last report?
      handled: false    // has this pass already graded?
    };

    // The end of speaking of the utterance being graded — the earliest signal
    // wins and later ones leave it alone. retryUnderstood() puts it back to 0,
    // which is what makes the next utterance the first again.
    function markSpokeEnd() {
      if (stt.spokeEndAt !== 0) return;
      // The level detector knows the real end of speaking; the result can be
      // seconds behind it. Only if it has nothing — no permission, or the
      // result overtook the end of speaking — does the current moment count,
      // which is what the measurement always fell back to.
      stt.spokeEndAt = stt.voiceEndAt || Date.now();
    }

    // The single route from a recognition result into the grading — the result
    // event and the end of the pass both take it, so the two cannot drift
    // apart. Returns the outcome of ML.chooseSpokenAnswer.
    function applyResult(assumeFinal) {
      var out = ML.chooseSpokenAnswer(pass.segments, {
        expected: session.expected,
        lang: lang(),
        assumeFinal: assumeFinal,
        // Continuously the segments of an utterance already reported on stay
        // in front of the new one. Without this the answer to the PREVIOUS
        // question would be graded against the current one.
        from: pass.consumed
      });
      if (out.status === 'pending') {
        // The child is still speaking. Show what stands there so far — that is
        // the proof the microphone is working — but grade nothing: a prefix of
        // the answer would cost the card a box.
        if (out.heard !== '') micSetEcho(out.heard);
        return out.status;
      }
      mic.speaking = false;
      mic.processing = false;
      if (out.status === 'none') {
        // The pass is NOT over: the recogniser keeps running and the child
        // gets to answer again into the same one. Only these segments are
        // used up — and with them the speech that produced them, otherwise
        // the end of the pass would report the same loss a second time.
        pass.consumed = pass.segments.length;
        pass.sawSpeech = false;
        // The recogniser heard something, just no number in it. Exactly that
        // has to become visible — otherwise the child is left guessing what
        // went wrong.
        sttLog(runId, forCard, 'no number in \u201e' + out.heard
          + '\u201c \u2014 not graded, asking again');
        micSetEcho(out.heard);
        micReport('error', t('mic.noNumber'));
        retryUnderstood(t('mic.notUnderstood'));
        return out.status;
      }
      // Only a graded value ends the pass — nextQuestion() builds the next
      // recogniser and this one is aborted with it.
      pass.handled = true;
      // What is shown is the wording the graded value came from — even when it
      // is wrong. The message has to stand before submitAnswer: otherwise the
      // next question follows in the same tick and overwrites it.
      micSetEcho(out.text);
      micReport('understood', t('mic.understood', { value: out.value }));

      var elapsed = Math.max(0, (stt.spokeEndAt || Date.now()) - session.startedAt);
      if (session.startedAt === 0) elapsed = 0;
      sttLog(runId, forCard, 'graded: ' + out.value + ' from alternative '
        + out.alternative + ' \u201e' + out.text + '\u201c, expected ' + session.expected
        + ', ' + elapsed + ' ms of ' + sttThresholdMs() + ' ms');
      submitAnswer(out.value, elapsed, sttThresholdMs());
      return out.status;
    }

    // 'start' and 'audiostart' are the evidence that the pass is really
    // running. Without that evidence the code used to wait for an 'end' that
    // never came.
    function reportStart(name) {
      if (rec !== stt.recognizer) {
        sttLog(runId, forCard, name + ' discarded (superseded)');
        return;
      }
      if (!stt.started) {
        stt.started = true;
        stt.everStarted = true;
        sttLog(runId, forCard, 'started (' + name + ')');
      }
      armWatchdog(STT_ALIVE_TIMEOUT_MS, 'no sign of life');
      micUpdate();   // from here on the status shows the mic.ready text
    }

    rec.addEventListener('start', function () { reportStart('start'); });
    rec.addEventListener('audiostart', function () { reportStart('audiostart'); });
    // Signs of life only, not logged — otherwise the console becomes useless
    // during normal practice.
    // Only the current pass may move the display of the current question. A
    // superseded recogniser still reports its speech and its end after the
    // next pass has long been running.
    function validForDisplay() {
      return rec === stt.recognizer && forCard === session.currentKey;
    }
    function speechStarted() {
      // Noted before the display guard: whether this pass heard speech decides
      // later whether a silent end is a failure or a non-event, and that is
      // true even for a pass whose display no longer belongs to it.
      pass.sawSpeech = true;
      if (!validForDisplay()) return;
      mic.speaking = true;
      mic.processing = false;
      // Whatever was heard last is outdated as soon as new speech begins.
      micClearEcho();
      micUpdate(true);
    }

    rec.addEventListener('soundstart', function () {
      sttHeartbeat(rec, STT_ALIVE_TIMEOUT_MS, 'no sign of life');
      speechStarted();
    });
    rec.addEventListener('speechstart', function () {
      sttHeartbeat(rec, STT_ALIVE_TIMEOUT_MS, 'no sign of life');
      speechStarted();
    });

    rec.addEventListener('speechend', function () {
      // Timestamp BEFORE the recognition — the recognition latency does not
      // count. This line stays the first in the handler and must have nothing
      // in front of it. Continuously this event comes once for the whole pass,
      // long after the utterance; it therefore only counts when no result has
      // timestamped the utterance yet.
      markSpokeEnd();
      sttLog(runId, forCard, 'speechend');
      // 'speechend' is followed by 'result' or 'error'; if both fail to come,
      // the recognition hangs.
      sttHeartbeat(rec, STT_ALIVE_TIMEOUT_MS, 'no result after speechend');
      if (!validForDisplay()) return;
      mic.speaking = false;
      mic.processing = true;
      micUpdate(true);
    });

    rec.addEventListener('result', function (event) {
      // First line, before anything else: this is the timestamp that gets
      // graded. Everything after it is bookkeeping.
      markSpokeEnd();
      // The whole result is kept, not just results[0]: the answer may sit in a
      // later segment, and the end of the pass needs the last state too.
      pass.segments = sttSegments(event.results);
      // A result is the proof that something was said. Continuously
      // 'speechstart' fires once per pass, so after a retry it would never
      // report speech again — and a lost utterance would look like silence.
      pass.sawSpeech = true;
      sttLog(runId, forCard, 'result: ' + sttResultLog(event.results));
      // The long deadline, always: continuously NO end follows a final result
      // either — the recogniser keeps listening for the next utterance. With
      // the short one the watchdog would shoot the pass down three seconds
      // after every answer.
      sttHeartbeat(rec, STT_ALIVE_TIMEOUT_MS, 'no sign of life after result');
      // Results of a pass belonging to a different question must not grade
      // this question.
      if (forCard !== session.currentKey) {
        sttLog(runId, forCard, 'result discarded (question is now '
          + (session.currentKey === null ? '\u2014' : session.currentKey) + ')');
        return;
      }
      // A result of any kind proves the recogniser works — including an
      // interim one, which is why this stands before the grading.
      stt.consecutiveErrors = 0;
      applyResult(false);
    });

    rec.addEventListener('error', function (event) {
      sttLog(runId, forCard, 'error: ' + event.error);
      // Whatever the error is, this pass has come to its conclusion here — the
      // end must not treat it as a silently lost utterance on top of that.
      pass.handled = true;
      // An error is normally followed by 'end'. If that fails to come, the
      // watchdog has to take over.
      sttHeartbeat(rec, STT_START_TIMEOUT_MS, 'no end after error');
      // An ordinary error of an outdated pass is none of this question's
      // business. A denied permission is: that applies to the microphone, not
      // to a single question.
      if (forCard !== session.currentKey && event.error !== 'not-allowed'
          && event.error !== 'service-not-allowed') {
        sttLog(runId, forCard, 'error discarded (different question)');
        return;
      }
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        stt.permissionDenied = true;
        setSttActive(false);
        el.feedback.textContent = t('mic.denied');
        return;
      }
      // no-speech, audio-capture, network, aborted: grade nothing, listen again.
      if (event.error === 'aborted') return;   // our own stopListening() call, not an error
      mic.speaking = false;
      mic.processing = false;
      stt.consecutiveErrors++;
      if (stt.consecutiveErrors >= STT_MAX_CONSECUTIVE_ERRORS) {
        setSttActive(false);
        el.feedback.textContent = t('mic.broken');
        return;
      }
      if (event.error === 'no-speech') {
        micReport('error', t('mic.nothingHeard'));
        retryUnderstood(t('mic.nothingHeardRetry'));
      } else {
        micReport('error', t('mic.problem'));
        retryUnderstood(t('mic.problemRetry'));
      }
    });

    rec.addEventListener('end', function () {
      // Only the current pass may restart itself. A superseded recogniser
      // reports its end only after startListening() has set the new one —
      // were it to restart here, it would immediately abort the fresh pass
      // again, and that endlessly. It must not clear the watchdog of the new
      // pass either.
      if (rec !== stt.recognizer) {
        sttLog(runId, forCard, 'end discarded (superseded)');
        return;
      }
      sttLog(runId, forCard, 'end');
      // This pass is finished; the next one arms its own watchdog.
      clearWatchdog();
      stt.started = false;
      // A pass that ends without ever having concluded is not a non-event. It
      // has two shapes, and both used to pass silently while the clock ran on
      // towards the deadline — and the deadline grades the card WRONG:
      //   * segments arrived but were never marked final — some engines end
      //     without ever setting isFinal, so the end finalises them here;
      //   * nothing arrived at all although there was speech — then the
      //     utterance is lost and the question has to be asked anew.
      // Either way the clock has to start over (retryUnderstood), because a
      // child with a bad microphone must not lose its progress to a deadline
      // it never got to see.
      var outcome = 'skipped';
      if (!pass.handled && forCard === session.currentKey && !session.awaitingAck) {
        outcome = applyResult(true);
        if (outcome === 'pending' && pass.sawSpeech) {
          sttLog(runId, forCard, 'ended after speech without a result \u2014 asking again');
          micReport('error', t('mic.lost'));
          retryUnderstood(t('mic.notUnderstood'));
        }
      }
      mic.speaking = false;
      mic.processing = false;
      // The browser ends after every result; restart while the mode is active.
      // startListening() checks by itself whether listening would be right now.
      // Only after a graded value not: submitAnswer has already moved on and
      // nextQuestion() started the next pass, which this call would abort
      // again right away.
      if (outcome !== 'value') startListening();
    });

    return rec;
  }

  // Recognition errors do NOT grade the card — they only ask the question anew.
  function retryUnderstood(message) {
    el.feedback.textContent = message;
    // The clock starts over: otherwise the second attempt would run against
    // the time of the first and could never be fast enough. The visible timer
    // and the deadline have to follow — a child with a bad microphone must not
    // lose its progress to deadlines it never got to see.
    session.startedAt = Date.now();
    // The measured end of speech belongs to the attempt just discarded. Left
    // standing it lies before the new start, and a result still arriving from
    // the running pass would be graded as 0 ms — measured against a clock that
    // no longer exists.
    stt.spokeEndAt = 0;
    stt.voiceEndAt = 0;
    rearmDeadline();
  }

  /* ---------- end of speaking from the microphone level ----------
     The recogniser cannot supply it: continuously 'speechend' comes once for
     the whole pass, and the result is 1.5 to 6 seconds late — measured. The
     level is therefore watched separately. The decision itself is
     ML.voiceStep in logic.js; what is left here is the audio graph.

     This grades nothing. It only supplies the timestamp the answer time is
     measured against, and it may fail without consequence: without it the
     measurement falls back to the moment of the result, which is what it
     always did. */
  var VOICE_TICK_MS = 50;
  var voice = { stream: null, ctx: null, analyser: null, buf: null,
                timer: null, state: ML.newVoiceState() };

  function voiceTick() {
    voice.analyser.getFloatTimeDomainData(voice.buf);
    var sum = 0;
    for (var i = 0; i < voice.buf.length; i++) sum += voice.buf[i] * voice.buf[i];
    var out = ML.voiceStep(voice.state, Math.sqrt(sum / voice.buf.length), Date.now());
    voice.state = out.state;
    if (out.event === null) return;
    if (out.event === 'start') {
      mic.speaking = true;
      mic.processing = false;
      micUpdate();
      return;
    }
    // The end of speaking of the utterance just spoken. Only noted — which
    // utterance gets graded with it is decided by markSpokeEnd() when a
    // result arrives.
    stt.voiceEndAt = out.at;
    mic.speaking = false;
    mic.processing = true;
    micUpdate();
  }

  function voiceStart() {
    if (voice.stream || !navigator.mediaDevices
        || !navigator.mediaDevices.getUserMedia) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      if (!stt.active) {   // switched off again while the permission was pending
        stream.getTracks().forEach(function (track) { track.stop(); });
        return;
      }
      voice.stream = stream;
      voice.ctx = new AC();
      voice.analyser = voice.ctx.createAnalyser();
      voice.analyser.fftSize = 1024;
      voice.ctx.createMediaStreamSource(stream).connect(voice.analyser);
      voice.buf = new Float32Array(voice.analyser.fftSize);
      voice.state = ML.newVoiceState();
      voice.timer = setInterval(voiceTick, VOICE_TICK_MS);
    }).catch(function (e) {
      // No level detector — the time measurement falls back to the moment of
      // the result. Worth a line, never a reason to stop listening.
      sttLog(stt.runId, session.currentKey,
             'level detector unavailable: ' + (e && e.name ? e.name : e));
    });
  }

  function voiceStop() {
    if (voice.timer !== null) { clearInterval(voice.timer); voice.timer = null; }
    if (voice.ctx) { try { voice.ctx.close(); } catch (e) { /* already closed */ } }
    if (voice.stream) {
      voice.stream.getTracks().forEach(function (track) { track.stop(); });
    }
    voice.stream = null;
    voice.ctx = null;
    voice.analyser = null;
    voice.buf = null;
    voice.state = ML.newVoiceState();
  }

  function startListening() {
    // Behind the open menu, while reading out and during the error display
    // there is no listening. Without this lock the 'end' handler restarts
    // immediately after the abort() from openMenu().
    if (!shouldListen()) { micUpdate(); return; }
    stopListening();                       // end a pass that is still running
    stt.spokeEndAt = 0;
    stt.voiceEndAt = 0;
    stt.runId++;
    stt.started = false;
    mic.speaking = false;
    mic.processing = false;
    var runId = stt.runId;
    var card = session.currentKey;
    stt.recognizer = buildRecognizer(card, runId);
    sttLog(runId, card, 'start requested');
    try {
      stt.recognizer.start();
    } catch (e) {
      // A start error used to be swallowed without comment — after that a
      // recogniser stood ready that never delivered an event, and the
      // microphone was silent for good. Now the watchdog takes over; the short
      // delay prevents recursion within the same tick.
      sttLog(runId, card, 'start() threw: ' + (e && e.name ? e.name : e));
      armWatchdog(STT_RESTART_DELAY_MS, 'start() threw');
      micUpdate();
      return;
    }
    armWatchdog(sttStartTimeout(), 'no start event');
    micUpdate();   // shows the mic.starting text until the beginning is confirmed
  }

  function stopListening() {
    // There is deliberately no listening here — so the watchdog has to rest too.
    clearWatchdog();
    stt.started = false;
    mic.speaking = false;
    mic.processing = false;
    micUpdate();
    if (!stt.recognizer) return;
    try { stt.recognizer.abort(); } catch (e) { /* not started */ }
  }

  function setSttActive(on) {
    stt.active = on;
    // The microphone state is deliberately NOT stored: the browser demands a
    // new permission gesture in every session, so a restored "on" would be a
    // lie. The field stays at its default value in the schema.
    renderSttButton();
    // The level detector belongs to the mode, not to the pass: its stream
    // outlives the recogniser, which is rebuilt for every question.
    if (on) voiceStart();
    else voiceStop();
    // startListening() builds the recogniser itself — a fresh one per pass.
    if (on) startListening();
    else stopListening();
    // Switching on and off is a deliberate action: it also clears a
    // short-lived message that may still stand.
    if (!on) micClearEcho();
    micUpdate(true);
    // With the microphone the applicable time threshold changes (bonus) and
    // with it the deadline. The clock itself stays where it is.
    rearmDeadline();
  }

  var sttButton = null;
  if (stt.supported) {
    sttButton = document.createElement('button');
    sttButton.id = 'stt-toggle';
    sttButton.type = 'button';
    sttButton.textContent = '🎤';
    sttButton.setAttribute('data-i18n-title', 'toolbar.stt');
    if (!stt.secure) {
      sttButton.disabled = true;
      sttButton.setAttribute('data-i18n-title', 'toolbar.sttInsecure');
    }
    el.toolbar.appendChild(sttButton);
    sttButton.addEventListener('click', function () {
      if (!stt.secure || stt.permissionDenied) return;
      setSttActive(!stt.active);
    });
  }

  function renderSttButton() {
    if (!sttButton) return;
    sttButton.setAttribute('aria-pressed', stt.active ? 'true' : 'false');
    sttButton.disabled = !stt.secure || stt.permissionDenied;
  }

  var menuButton = document.createElement('button');
  menuButton.id = 'menu-button';
  menuButton.type = 'button';
  menuButton.textContent = '☰';
  menuButton.setAttribute('data-i18n-title', 'toolbar.menu');
  el.toolbar.appendChild(menuButton);

  function renderStats() {
    var p = profile();
    var boxes = ML.boxDistribution(p);
    var timed = [];
    ML.ALL_CARD_KEYS.forEach(function (k) {
      var c = p.cards[k];
      if (c && c.bestMs !== null && c.box < ML.BOX_MASTERED) timed.push({ key: k, ms: c.bestMs });
    });
    timed.sort(function (a, b) { return b.ms - a.ms; });

    // Only numbers from our own code go into innerHTML, never a profile name.
    var strong = function (n) { return '<strong>' + n + '</strong>'; };
    var html = '<div>' + t('stats.open', { n: strong(ML.openCount(p)),
                                            total: ML.selectedCardKeys(rows()).length }) +
               ' &middot; ' + t('stats.mastered', { n: strong(boxes[ML.BOX_MASTERED]) }) + '</div>' +
               '<div>' + t('stats.totalAnswers', { n: p.stats.totalAnswers }) +
               ' &middot; ' + t('stats.sessions', { n: p.stats.sessions }) + '</div>';

    if (timed.length > 0) {
      html += '<div style="margin-top:.6rem">' + t('stats.slowest') + '</div><table>';
      timed.slice(0, 5).forEach(function (row) {
        var ab = ML.parseCardKey(row.key);
        html += '<tr><td>' + ab.a + ' × ' + ab.b + '</td><td>' +
                ML.timeText(row.ms, lang()) + '</td></tr>';
      });
      html += '</table>';
    }
    el.stats.innerHTML = html;
  }

  // What a box means — in one sentence a child understands too. Functions
  // rather than constants, because the language is only known at drawing
